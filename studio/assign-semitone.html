<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assign Semitone Drills — Gables Guitar Studio</title>
<link rel="icon" href="../favicon.ico" sizes="any">
<style>
  :root{ color-scheme:dark; --bg:#121212; --ink:#ededed; --mid:#9b9b9b; --line:#3a3a3a; --ok:#9fd39f; --err:#f0a0a0; --accent:#f5e33a }
  body{ margin:0; background:var(--bg); color:var(--ink); font:16px/1.45 "Helvetica Neue",Helvetica,Arial,system-ui,sans-serif }
  main{ max-width:560px; margin:0 auto; padding:32px 16px 48px; display:grid; gap:18px }
  h1{ margin:0; font-size:26px } p{ margin:0 } .mid{ color:var(--mid) }
  ul{ margin:0; padding:0; list-style:none; display:grid; gap:8px }
  li{ display:flex; justify-content:space-between; gap:12px; padding:10px 12px; border:1px solid var(--line); border-radius:8px }
  li .st{ color:var(--mid); font-size:14px; text-align:right } li .st.ok{ color:var(--ok) } li .st.err{ color:var(--err) }
  label{ display:grid; gap:6px; font-size:14px; color:var(--mid) }
  input{ font:inherit; padding:8px 10px; border-radius:6px; border:1px solid var(--line); background:#1b1b1b; color:var(--ink) }
  button{ font:inherit; font-weight:700; padding:10px 20px; border-radius:999px; border:2px solid var(--ink); background:var(--ink); color:var(--bg); cursor:pointer; justify-self:start }
  button:disabled{ opacity:.45; cursor:default }
  a{ color:var(--accent) }
</style>
</head>
<body>
<main>
  <h1>Assign Semitone Drills</h1>
  <p class="mid">Adds the Semitone drill page to each routine below as a Technique item, 10 minutes a day, opening the drill. One click sends all three. Your studio passphrase is the one the Drill Designer uses; if this browser has it saved, it is filled in.</p>
  <ul id="who"></ul>
  <label for="pass">Studio passphrase <input type="password" id="pass" autocomplete="current-password"></label>
  <button type="button" id="go">Assign to all three</button>
  <p id="msg" class="mid" aria-live="polite"></p>
</main>
<script src="config.js?v=41"></script>
<script>
(function(){
  var STUDENTS=['Brian Hunker','Victor Gadda','Stephen Roansky'], LEFT={'Stephen Roansky':1};
  var LINK='https://brianhunker.github.io/Tonal-Field/technique/semitone.html';
  var item={ title:'Semitone Drills', params:{kind:'task',label:'Technique',link:LINK,daily:10},
             notes:'Open the Semitone page. Drill: work the string, fingers and direction we set in the lesson, lower fingers staying down. Then switch to Test and play it through once.' };
  var who=document.getElementById('who'), pass=document.getElementById('pass'), go=document.getElementById('go'), msg=document.getElementById('msg');
  var rows=STUDENTS.map(function(n){ var li=document.createElement('li'); li.innerHTML='<span></span><span class="st">not sent</span>'; li.firstChild.textContent=n+(LEFT[n]?' · left-handed':''); who.appendChild(li); return li.lastChild; });
  try{ pass.value=localStorage.getItem('studio-pass')||''; }catch(e){}
  function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  function post(p){ return fetch(window.STUDIO_API,{method:'POST',body:JSON.stringify(p)}).then(function(r){ return r.json(); }); }
  go.onclick=function(){
    if(!window.STUDIO_API){ msg.textContent='The studio is not connected to its Sheet (config.js has no address).'; return; }
    go.disabled=true; msg.textContent='Sending…';
    try{ localStorage.setItem('studio-pass',pass.value); }catch(e){}
    var today=ymd(new Date()), failed=0, i=0;
    (function next(){                                            // one at a time, so the Sheet's lock is never contended
      if(i>=STUDENTS.length){ msg.textContent=failed?(failed+' did not go through; fix the problem and press again to resend those.'):'Done. All three routines have Semitone Drills.'; go.disabled=!failed; return; }
      var k=i++, st=rows[k];
      if(st.classList.contains('ok')){ next(); return; }
      st.textContent='sending…'; st.className='st';
      post(Object.assign({action:'assign',pass:pass.value,student:STUDENTS[k],inst:'guitar',hand:LEFT[STUDENTS[k]]?'left':'right',date:today,ex:''},item)).then(function(r){
        if(r&&r.ok){ st.className='st ok'; st.innerHTML='assigned as item '+r.ex+' · <a href="student.html?s='+encodeURIComponent(r.sid)+'" target="_blank" rel="noopener">their page</a>'; }
        else{ failed++; st.className='st err'; st.textContent=(r&&r.error==='wrong passphrase')?'wrong passphrase':((r&&r.error)||'no answer'); }
      },function(){ failed++; st.className='st err'; st.textContent='could not reach the Sheet'; }).then(next);
    })();
  };
})();
</script>
</body>
</html>
