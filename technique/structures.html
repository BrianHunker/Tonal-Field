<!doctype html>
<html lang="en">
<head>

<title>Harmonic Structures</title>
<link rel="icon" href="../favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:ital,wght@1,500&display=swap" rel="stylesheet">

<style>
/* Harmonic Structures: one tool for every structure. Top to bottom: the structure's name (a menu of all of them) and g(x);
   the controls (Play, Hold, Prev | Next, Let Go, tempo; the gear for sound and display); Listen (g(x) on); the TAB
   beside the ring; the means of the step between tones; the fretboard and the hand. No instruction text: the pulsing
   fingers and frets lead. Grayscale unless g(x) is on. */
:root{
  --bg:#ffffff;
  --ink:#121212;
  --mid:#6e6e6e;
  --faint:#d4d4d4;
  --board:#f2f2f2;
  color-scheme:light;
  --sans:"Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;
  --serif:"IBM Plex Serif",Georgia,serif;
  --faCol:#b89400; --tiCol:#c000c0; --doCol:#178f17; --reCol:#c86400; --miCol:#2255FF; --solCol:#c80000; --laCol:#732699; --gxg:#a8780c; --eqx:#77746c; --eqenv:#5d594f; --eqcar:#1d8a6b; --eqs5:#c4572a; --eqs7:#1f7fae;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#0f0f0f; --ink:#ededed; --mid:#9b9b9b; --faint:#3a3a3a; --board:#1a1a1a; --faCol:#FFD700; --tiCol:#FF00FF; --doCol:#22BB22; --reCol:#FF8800; --miCol:#4a74ff; --solCol:#ff2a2a; --laCol:#a462d8; --gxg:#d8a838; --eqx:#aaaaaa; --eqenv:#c8c4b8; --eqcar:#5acca8; --eqs5:#ffa07a; --eqs7:#7ad9ff; color-scheme:dark }
}
:root[data-theme="dark"]{ --bg:#0f0f0f; --ink:#ededed; --mid:#9b9b9b; --faint:#3a3a3a; --board:#1a1a1a; --faCol:#FFD700; --tiCol:#FF00FF; --doCol:#22BB22; --reCol:#FF8800; --miCol:#4a74ff; --solCol:#ff2a2a; --laCol:#a462d8; --gxg:#d8a838; --eqx:#aaaaaa; --eqenv:#c8c4b8; --eqcar:#5acca8; --eqs5:#ffa07a; --eqs7:#7ad9ff; color-scheme:dark }

*{ box-sizing:border-box }
[hidden]{ display:none !important }
body{ margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans); font-size:15px; line-height:1.4; font-variant-numeric:tabular-nums }
.wrap{ max-width:980px; margin:0 auto; padding-inline:16px; padding-block:22px 44px; display:grid; gap:18px }
header{ display:flex; flex-wrap:wrap; align-items:flex-end; gap:8px 16px; margin-bottom:-6px }   /* the g(x) button sits just above the bar's line, mirroring the gear just below it */
.hd{ display:grid; gap:2px; margin-right:auto }
.gxRow{ display:flex; align-items:center; gap:12px; margin-left:auto; min-width:0 }
.eqn{ display:flex; flex-wrap:wrap; justify-content:flex-end; column-gap:.32em; font-family:var(--serif); font-style:italic; font-weight:500; font-size:clamp(12px,1.75vw,18px); line-height:1.3; letter-spacing:.01em; color:var(--eqx); text-align:right;
  opacity:0; transform:translateX(12px); visibility:hidden; transition:opacity .9s ease, transform .9s ease, visibility 0s linear .9s }
.eqn.on{ opacity:1; transform:none; visibility:visible; transition:opacity .9s ease, transform .9s ease, visibility 0s }
.eqn > span{ white-space:nowrap }
.eqn .e-env{ color:var(--eqenv) } .eqn .e-car{ color:var(--eqcar) } .eqn .e-s5{ color:var(--eqs5) } .eqn .e-s7{ color:var(--eqs7) }
.gx{ font-family:var(--serif); font-style:italic; font-weight:500; font-size:14px; letter-spacing:.01em; line-height:1; flex:none; display:grid; place-items:center; width:36px; height:36px; padding:0 1px 1px 0; border:1px solid var(--mid); border-radius:50%; background:var(--bg); color:var(--mid); cursor:pointer; transition:color .6s, border-color .6s, box-shadow .6s }
.gx[aria-pressed="true"]{ color:var(--gxg); border-color:var(--gxg); box-shadow:0 0 12px -3px var(--gxg) }
@media (prefers-reduced-motion: reduce){ .eqn, .eqn.on, .gx{ transition:none } }
.eyebrow{ margin:0; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--mid) }
h1{ margin:0; font-size:30px; font-weight:700; letter-spacing:-.01em; line-height:1.1; text-wrap:balance }
.stage{ display:grid; grid-template-columns:minmax(0,3fr) minmax(0,1fr); gap:16px 28px; align-items:center }
.ringBox{ display:flex; flex-direction:column; align-items:center; gap:8px; min-width:0 }
.ringSeg button{ font-size:12px; padding:4px 9px }
.ringBox svg{ width:100%; max-width:264px; height:auto }
.ins{ min-width:0; display:grid; grid-template-columns:minmax(0,1fr); gap:8px; align-content:start; min-height:9.5em }
.ins h2{ margin:0; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--mid); font-weight:600 }
.insFacts{ margin:0; font-weight:600 }
.insHow{ margin:0; max-width:64ch }
.insHow span{ color:var(--mid) }
.insHow[hidden]{ display:none }
.insTog{ font:inherit; letter-spacing:inherit; text-transform:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; display:inline-flex; align-items:center; gap:6px }
.insTog:hover{ color:var(--ink) }
.chev{ width:7px; height:7px; border-right:1.5px solid currentColor; border-bottom:1.5px solid currentColor; transform:rotate(-45deg); transition:transform .2s ease; margin-top:-1px }
.insTog[aria-expanded="true"] .chev{ transform:rotate(45deg); margin-top:-4px }
@media (prefers-reduced-motion: reduce){ .chev{ transition:none } }
.listen{ display:grid; gap:6px; margin-top:4px; animation:lsIn .9s ease }
.listen[hidden]{ display:none }
@keyframes lsIn{ from{ opacity:0; transform:translateY(4px) } to{ opacity:1; transform:none } }
.lsLine{ margin:0; display:flex; flex-wrap:wrap; align-items:center; gap:6px 12px }
.hearSeg{ position:relative; display:inline-flex; gap:2px }
.hearKnob{ position:absolute; top:0; bottom:0; left:0; width:0; border-radius:9px; background:var(--faint); transition:transform .35s ease, width .35s ease }
.hearSeg button{ position:relative; z-index:1; font:inherit; font-weight:600; padding:4px 12px; border:0; border-radius:9px; background:none; color:var(--mid); cursor:pointer }
.hearSeg button[aria-checked="true"]{ color:var(--ink) }
.hearSeg b{ font-family:var(--serif); font-style:italic; font-weight:500; font-size:1.12em }
.sTi{ color:var(--tiCol) } .sDo{ color:var(--doCol) } .sRe{ color:var(--reCol) } .sMi{ color:var(--miCol) } .sFa{ color:var(--faCol) } .sSol{ color:var(--solCol) } .sLa{ color:var(--laCol) }
.hearSeg{ flex-wrap:wrap }
.hearSeg .us{ color:var(--mid); padding:0 .12em }
body:not(.gxOn) .hearSeg b{ color:inherit }   /* grayscale unless g(x) is on */
.chainArrow{ color:var(--mid); padding:0 .3em }
.lsChain{ display:grid; gap:3px; max-width:64ch }
.lsRow{ margin:0; min-width:0; overflow-wrap:anywhere } .lsRow span{ color:var(--mid) }
.lsWalk, .lsPairs{ display:flex; flex-wrap:wrap; align-items:baseline; row-gap:2px }   /* break between names and between pairs, never past the column */
.lsRow + .lsRow:not(.lsWalk):not(.lsPairs){ margin-top:8px }
.lsWalk b{ font-family:var(--serif); font-style:italic; font-weight:500; font-size:1.25em }
.lsPairs{ color:var(--mid); font-size:14px } .lsPairs b{ font-family:var(--serif); font-style:italic; font-weight:600; font-size:1.08em }
.lsDot{ padding:0 .55em } .lsPair{ white-space:nowrap; color:var(--mid) }
.listen, .lsChain{ min-width:0 }
body:not(.gxOn) .lsChain b{ color:inherit }
@media (prefers-reduced-motion: reduce){ .listen{ animation:none } .hearKnob{ transition:none } }
.insTest{ margin:0; justify-self:start; font-size:13px; font-weight:700; padding:4px 10px; border:1.5px solid var(--ink); border-radius:999px }
@media (max-width:640px){ .stage{ grid-template-columns:1fr } .ringBox svg{ max-width:220px } }
.bar{ display:flex; flex-wrap:wrap; align-items:center; gap:10px 20px; padding-block:12px; border-top:1px solid var(--faint); border-bottom:1px solid var(--faint) }
.play{ font:inherit; font-weight:700; min-width:92px; padding:8px 18px; border:2px solid var(--ink); background:var(--ink); color:var(--bg); border-radius:999px; cursor:pointer }
.play.on{ background:var(--bg); color:var(--ink) }
.gear{ font:inherit; font-size:28px; line-height:1; display:grid; place-items:center; padding:0 0 2px; width:36px; height:36px; margin-left:auto; border:1px solid var(--mid); border-radius:50%; background:var(--bg); color:var(--ink); cursor:pointer }
.gear[aria-expanded="true"]{ background:var(--ink); color:var(--bg); border-color:var(--ink) }
button:focus-visible, input:focus-visible{ outline:2px solid var(--ink); outline-offset:2px }
.ctl{ display:flex; align-items:center; gap:8px; color:var(--mid); font-size:13px; margin:0 }
.ctl b{ color:var(--ink); font-weight:600; min-width:2.2em; text-align:right }
.ctl.off{ color:var(--faint) }
.seg{ display:inline-flex; border:1px solid var(--mid); border-radius:6px; overflow:hidden }
.seg button{ font:inherit; font-size:13px; padding:5px 11px; border:0; border-left:1px solid var(--mid); background:var(--bg); color:var(--ink); cursor:pointer }
.seg button:first-child{ border-left:0 }
.seg button[aria-pressed="true"]{ background:var(--ink); color:var(--bg) }
.seg button:disabled{ color:var(--faint); cursor:default }
.seg button:disabled[aria-pressed="true"]{ background:var(--faint); color:var(--bg) }
input[type=range]{ accent-color:var(--ink); width:130px }
input[type=checkbox]{ accent-color:var(--ink) }
.mixer{ display:grid; gap:10px; padding:14px 16px; border:1px solid var(--mid); border-radius:8px; max-width:540px; margin-top:-6px }
.mixer h2{ margin:0 0 2px; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--mid); font-weight:600 }
.mixRow{ display:grid; grid-template-columns:7em 1fr 3.8em auto; align-items:center; gap:12px; font-size:13px }
.mixRow .name{ color:var(--ink); font-weight:600 }
.mixRow input[type=range]{ width:100%; min-width:0 }
.mixRow b{ text-align:right; font-weight:600; white-space:nowrap }
.mixRow label{ display:flex; align-items:center; gap:6px; color:var(--mid) }
.mixRow.sub .name{ color:var(--mid); font-weight:400 }
.mixRow.sub .seg{ grid-column:2 / -1; justify-self:start }
@media (max-width:480px){ .mixRow{ grid-template-columns:5.5em 1fr 3.8em auto; gap:8px } }
.params{ flex:1 1 100%; display:flex; flex-wrap:wrap; align-items:center; gap:10px 20px }
.chapters{ flex:1 1 100%; display:grid; gap:6px }
.mode{ position:relative; display:inline-grid; grid-template-columns:1fr 1fr; padding:0; border:2px solid var(--ink); border-radius:999px; background:var(--bg); font:inherit; font-weight:700; cursor:pointer }
.mOpt{ position:relative; z-index:1; padding:7px 16px; color:var(--ink); transition:color .2s }
.mKnob{ position:absolute; top:2px; bottom:2px; left:2px; width:calc(50% - 2px); border-radius:999px; background:var(--ink); transition:transform .2s ease }
.mode[aria-checked="true"] .mKnob{ transform:translateX(100%) }
.mode[aria-checked="false"] .mOpt:first-child, .mode[aria-checked="true"] .mOpt:nth-child(2){ color:var(--bg) }
.mode:disabled{ cursor:default; opacity:.5 }
@media (prefers-reduced-motion: reduce){ .mKnob, .mOpt{ transition:none } }
.chHead{ display:flex; align-items:center; gap:12px; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--mid); font-weight:600 }
.chAll{ font:inherit; font-size:11px; letter-spacing:.02em; text-transform:none; padding:2px 9px; border:1px solid var(--mid); border-radius:999px; background:var(--bg); color:var(--ink); cursor:pointer }
.chRow{ display:grid; grid-template-columns:repeat(13,minmax(0,1fr)); gap:4px }
@media (max-width:720px){ .chRow{ grid-template-columns:repeat(7,minmax(0,1fr)) } }
.ch{ --p:0; font:inherit; font-size:12px; font-weight:600; padding:6px 2px; border:1.5px solid var(--ink); border-radius:6px; color:var(--ink); cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  background:linear-gradient(to right, var(--faint) calc(var(--p) * 100%), var(--bg) 0) }
.ch[aria-pressed="false"]{ border-style:dashed; border-color:var(--mid); color:var(--mid); text-decoration:line-through }
.ch.now{ box-shadow:inset 0 0 0 1px var(--ink) }
.ch.done{ background:var(--ink); color:var(--bg) }
.ch:disabled{ cursor:default }
.panel{ width:100%; min-width:0; overflow:hidden }
.panel.wide{ overflow-x:auto; overscroll-behavior-x:contain; scrollbar-width:thin }
svg{ display:block; width:100%; height:auto; max-width:100%; font-family:var(--sans) }

/* SVG parts, all through the tokens */
.ink{ fill:var(--ink) } .mid{ fill:var(--mid) } .board{ fill:var(--board) }
.inkS{ stroke:var(--ink) } .midS{ stroke:var(--mid) } .faintS{ stroke:var(--faint) }
.pickBody{ fill:var(--mid); stroke:rgba(0,0,0,.5); stroke-width:1.2; vector-effect:non-scaling-stroke }   /* grey with g(x) off; its fill is set each frame */
.pickArrow{ fill:var(--bg) }
.pickAxis{ stroke:var(--mid); stroke-width:1; stroke-dasharray:3 3; opacity:.5 }
path.vibBlur{ fill:var(--ink); opacity:.3; stroke:none }
path.vibStrobe{ fill:none; stroke:var(--ink); stroke-width:1.8; stroke-linejoin:round; stroke-linecap:round }
/* left-handed: the fretboard mirrored (nut on the right, pick on the left); its numbers turned back to read normally */
#fb.lefty{ transform:scaleX(-1) }
#fb.lefty text{ transform-box:fill-box; transform-origin:center; transform:scaleX(-1) }
path.strDim{ stroke:var(--mid); opacity:.45 }                            /* the strings the drill is not on */
.fingerC{ fill:var(--bg); stroke:var(--ink); stroke-width:1.6 } .fingerC.down{ fill:var(--ink) }
.fingerN{ fill:var(--ink); font-weight:700; font-size:15px; text-anchor:middle; dominant-baseline:central; pointer-events:none } .fingerN.down{ fill:var(--bg) }
.guide{ stroke:var(--faint); stroke-dasharray:2 3 }
.fretn{ fill:var(--mid); font-size:10px; text-anchor:middle }
.lbl{ fill:var(--mid); font-size:11px } .lbl.sel{ fill:var(--ink); font-weight:700 }
.clef{ fill:var(--ink); font-size:24px; font-weight:700; text-anchor:middle; dominant-baseline:central }
.row{ stroke:var(--mid) } .row.sel{ stroke:var(--ink) }
.hit{ fill:transparent; cursor:pointer }
.num{ fill:var(--ink); font-weight:700; font-size:14px; text-anchor:middle; dominant-baseline:central; pointer-events:none }
.knock{ fill:var(--bg) }
.num.tied{ font-weight:600; letter-spacing:-.04em }   /* the sounding number is marked by its colour bloom, not a box */
.tsig{ fill:var(--ink); font-size:24px; font-weight:700; text-anchor:middle; dominant-baseline:central }
.bendLbl{ fill:var(--ink); font-size:13px; font-weight:700; text-anchor:middle; dominant-baseline:central }
.curve{ fill:none; stroke:var(--ink); stroke-width:1.3 }
.headS{ stroke:var(--mid) }
.dot{ fill:var(--bg); stroke:var(--ink); stroke-width:1.4 } .dot.on{ fill:var(--ink) }
.rl{ fill:var(--mid); text-anchor:middle; dominant-baseline:central } .rl.pair{ fill:var(--ink) } .rl.on{ fill:var(--ink); font-weight:700 }
.rd{ fill:var(--mid) } .rd.on{ fill:var(--ink) }
.hand{ stroke:var(--ink); stroke-width:1.5; stroke-dasharray:4 3; stroke-linecap:round }
.wedge{ fill:none; stroke:var(--ink); stroke-width:2 }
.valLbl{ font-family:var(--serif); font-style:italic; font-weight:500; text-anchor:middle; dominant-baseline:central; paint-order:stroke; stroke:var(--bg); stroke-width:3px; stroke-linejoin:round }
.hd{ display:grid; gap:2px; margin-right:auto; position:relative }
.structBtn{ font:inherit; font-size:30px; font-weight:700; letter-spacing:-.01em; line-height:1.1; color:var(--ink); background:none; border:0; padding:0; cursor:pointer; display:inline-flex; align-items:center; gap:12px; text-align:left }
.caret{ width:9px; height:9px; border-right:2px solid var(--mid); border-bottom:2px solid var(--mid); transform:rotate(45deg); margin-top:-7px }
.structMenu{ position:absolute; z-index:5; top:100%; left:0; margin-top:6px; min-width:230px; background:var(--bg); border:1px solid var(--mid); border-radius:8px; padding:6px; display:grid; gap:2px; box-shadow:0 10px 28px rgba(0,0,0,.35) }
.structMenu a, .structMenu span{ display:flex; justify-content:space-between; align-items:baseline; gap:14px; padding:7px 10px; border-radius:6px; color:var(--ink); text-decoration:none; font-size:14px }
.structMenu a:hover{ background:var(--faint) } .structMenu .cur{ font-weight:700 } .structMenu .soon{ color:var(--mid) } .structMenu small{ color:var(--mid); font-size:11px }
.pill{ font:inherit; font-weight:600; font-size:13px; padding:6px 14px; border:1.5px solid var(--ink); border-radius:999px; background:var(--bg); color:var(--ink); cursor:pointer }
.pill[aria-pressed="true"]{ background:var(--ink); color:var(--bg) }
.pillPair{ display:inline-flex; border:1.5px solid var(--ink); border-radius:999px; overflow:hidden }
.pillPair button{ font:inherit; font-weight:600; font-size:13px; padding:6px 13px; border:0; background:var(--bg); color:var(--ink); cursor:pointer }
.pillPair button+button{ border-left:1.5px solid var(--ink) }
.play:disabled{ opacity:.35; cursor:default }
.stage{ align-items:start }
.tabCol{ min-width:0; display:grid; gap:6px; align-content:start }
.ringFoot{ display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:14px; width:100% }
.ringFoot > :first-child{ justify-self:end } .ringFoot > :last-child{ justify-self:start }
.ghostBtn{ display:grid; place-items:center; width:44px; height:44px; border-radius:50%; border:1.5px solid var(--ink); padding:0; cursor:pointer; background:var(--bg); color:var(--ink) }
.ghostBtn svg{ width:24px; height:24px } .ghostBtn[aria-pressed="true"]{ background:var(--ink); color:var(--bg) }
.ghostLine{ fill:none; stroke:var(--ink); stroke-width:1.3; stroke-dasharray:3 3; opacity:.5 }
#ring{ border-radius:50%; outline:none; transition:box-shadow .2s }
.ringBox.sel #ring, #ring.sel{ box-shadow:0 0 0 1.5px var(--mid), 0 0 22px -6px var(--ink) }
body:not(.gxOn) .gxOnly{ visibility:hidden }
.order{ display:inline-grid; grid-template-columns:1fr 1fr; width:44px; height:44px; border-radius:50%; border:1.5px solid var(--ink); overflow:hidden; padding:0; cursor:pointer; background:var(--bg); font:inherit; font-weight:700; font-size:15px }

.valLbl{ pointer-events:auto } .wedge{ pointer-events:none }

.sylPop{ font-family:var(--serif); font-style:italic; font-weight:500; font-size:26px; text-anchor:middle; dominant-baseline:central; paint-order:stroke; stroke:var(--bg); stroke-width:4px; stroke-linejoin:round }

</style></head><body>

<div class="wrap">
  <header>
    <div class="hd">
      <p class="eyebrow">Harmonic structure</p>
      <button id="structBtn" class="structBtn" type="button" aria-haspopup="menu" aria-expanded="false" title="All the harmonic structures"><span id="structName">Semitone</span><span class="caret" aria-hidden="true"></span></button>
      <div class="structMenu" id="structMenu" role="menu" hidden></div>
    </div>
    <div class="gxRow">
      <div class="eqn" id="eqn" aria-hidden="true"><span><span class="e-env">cos(x)</span>·<span class="e-car">cos(6x)</span> + (1/6)·<span class="e-env">sin(x)</span>·<span class="e-car">sin(6x)</span> =</span><span><span class="e-s5">(7/12)·cos(5x)</span> + <span class="e-s7">(5/12)·cos(7x)</span> =</span></div>
      <button id="gx" class="gx" type="button" aria-pressed="false" title="g(x): the tonal field — valence on the ring and in the tone colours">g(x)</button>
    </div>
  </header>

  <div class="bar">
    <button id="play" class="play" type="button" disabled>Play</button>
    <button id="hold" class="pill" type="button" aria-pressed="false" title="Hold: keep drilling this place instead of advancing">Hold</button>
    <div class="pillPair"><button id="prev" type="button" title="The previous sample">Prev</button><button id="next" type="button" title="The next sample">Next</button></div>
    <button id="clear" class="pill" type="button" title="Let go of every finger and start a fingering from nothing">Let Go</button>
    <label class="ctl" for="bpm">Tempo <input type="range" id="bpm" min="40" max="140" value="70"> <b id="bpmv">70</b></label>
    <label class="ctl" for="click"><input type="checkbox" id="click" checked> Click</label>
    <button id="gear" class="gear" type="button" aria-expanded="false" aria-controls="mixer" title="Sound and display">&#x2699;&#xFE0E;</button>

<script>
(function(){
'use strict';
const NS='http://www.w3.org/2000/svg';
const el=(tag,attrs,parent)=>{const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;};
const reduce=!!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches);

/* ---------- Harmonic Structures: one tool, Semitone first ----------
   Three things set a drill, each in one place: the HAND chooses the frequencies (fingers paired to frets, or open strings),
   the RING sets the orientation φ, and the LISTEN chooser sets which hearing of those frequencies is drilled (it morphs φ
   one tick, the hand staying put). The orientation is set, then drilled: nothing changes φ while playback runs.
   A drill is a set of pairings. Play is enabled exactly when the pairings complete the structure. Advancing is how the
   tool runs: after 4 loops the next sample's pairings replace the current ones, unless Hold is on. Every drill reverses. */
const BASS=(()=>{ let inst='acoustic', n=4; try{ const m=JSON.parse(localStorage.getItem('semitone-drills-mix-5')||'null'); if(m){ if(m.inst) inst=m.inst; if(m.bass===5) n=5; } }catch(err){}
  try{ const q=new URLSearchParams(location.search).get('inst'); if(q==='bass'||q==='bass4'||q==='bass5'){ inst='bass'; if(q!=='bass') n=q==='bass5'?5:4; } else if(q==='guitar'&&inst==='bass') inst='acoustic'; }catch(err){}
  return inst==='bass'?n:0; })();
const STRINGS=BASS?[{lbl:'G',name:'G',hz:97.9989,pc:10},{lbl:'D',name:'D',hz:73.4162,pc:5},{lbl:'A',name:'A',hz:55,pc:0},{lbl:'E',name:'E',hz:41.2034,pc:7},{lbl:'B',name:'low B',hz:30.8677,pc:2}].slice(0,BASS)
  :[{lbl:'e',name:'high e',hz:329.6276,pc:7},{lbl:'B',name:'B',hz:246.9417,pc:2},{lbl:'G',name:'G',hz:195.9977,pc:10},{lbl:'D',name:'D',hz:146.8324,pc:5},{lbl:'A',name:'A',hz:110.0,pc:0},{lbl:'E',name:'low E',hz:82.4069,pc:7}]; // pc = semitones above A
const NSTR=STRINGS.length, GAUGE=i=>BASS?[0.7,0.8,0.9,1,1][i]:i/5;     // the string model's gauge: 0 the high e … 1 the low E; bass strings heavy
const NAMES=['A','A♯/B♭','B','C','C♯/D♭','D','D♯/E♭','E','F','F♯/G♭','G','G♯/A♭'];
const fretHz=(s,n)=>STRINGS[s].hz*Math.pow(2,n/12);
const pcOf=(s,fret)=>((STRINGS[s].pc+fret)%12+12)%12;   // fret may be fractional, mid-slide
const openMidi=i=>69+12*Math.log2(STRINGS[i].hz/440);
const midiOf=(s,f)=>Math.round(openMidi(s))+f;
const FMAX=12;                                                          // the board shows frets 0–12
let FIG=[{s:0,d:.5},{s:.5,d:.5},{s:1,d:.5},{s:1.5,d:.5},{s:2,d:.5},{s:2.5,d:.5},{s:3,d:.5},{s:3.5,d:.5},{s:4,d:2},{s:6,d:2}];   // bar 1 eight eighths, bar 2 two halves: the two tones alternate, so the loop reverses
let BAR_START=i=>i===0||i===8;
let LOOP=8, STROKES=2; const COUNT=4, LEAD=0.06, SLIDE_T=0.09, ADV_LOOPS=4;
const catchT=()=>Math.min(0.06,0.15*T.beat/2);
const POSITION=5;
const drill={dir:'up',plant:true,bpm:70,click:true,hold:false};
const SYL=['Do','Re','Mi','Fa','Sol','La','Ti'], SYLPC=[0,2,4,5,7,9,11];
const PHI={doPc:3,root:0};                                             // Do's pitch (semitones above A; 3 = C) and the modal root, by syllable
const HEAR={tido:{lo:11,names:['Ti','Do']},mifa:{lo:4,names:['Mi','Fa']}};
let hearing='tido', diatonic=true;
let FLAT_OFF=false, SEG_EACH=false;                                     // SEG_EACH: every pass of a drill is its own segment, with its own count-in                                                    // a page whose field, g(x) going off, flattens to a grey circle rather than fading
const relOf=pc=>(((pc-PHI.doPc)%12)+12)%12;
const sylOf=pc=>{ const k=SYLPC.indexOf(relOf(pc)); return k<0?null:SYL[k]; };
const hearingOf=D=>{ if(!D) return null; const r=relOf(pcOf(D.lo.s,D.lo.f)); return r===11?'tido':(r===4?'mifa':null); };
const LETTER=['A','A♯','B','C','C♯','D','D♯','E','F','F♯','G','G♯'], LETTER_B=['A','B♭','B','C','D♭','D','E♭','E','F','G♭','G','A♭'];
const nameOf=m=>{ const pc=((m-69)%12+12)%12, flat=[1,6,8,11,4].includes(PHI.doPc)||PHI.doPc===8; return (flat?LETTER_B:LETTER)[pc]+(Math.floor(m/12)-1); };

/* ---------- where the structure lives ----------
   A semitone is two tones a semitone apart: along one string (frets f, f+1), or across to the neighbouring string within
   a hand's reach (the upper tone on the higher string, up to 4 frets back). Under the field, only those heard in the chosen
   hearing count: Ti–Do (the lower tone Ti) or Mi–Fa. With g(x) off there is no field and every semitone counts. */
const ALL_SEMI=(()=>{ const out=[];
  for(let s=0;s<NSTR;s++) for(let f=0;f<FMAX;f++) out.push({lo:{s,f},hi:{s,f:f+1}});
  for(let s=0;s<NSTR-1;s++){ const sl=s+1, sh=s;
    for(let f=0;f<=FMAX;f++){ const g=midiOf(sl,f)+1-midiOf(sh,0); if(g>=0&&g<=FMAX&&Math.abs(f-g)<=4) out.push({lo:{s:sl,f},hi:{s:sh,f:g}}); } }
  return out; })();
function instances(){ if(!FIELD.on) return ALL_SEMI; const lo=HEAR[hearing].lo; return ALL_SEMI.filter(r=>relOf(pcOf(r.lo.s,r.lo.f))===lo); }

/* ---------- the hand ----------
   One rule: neighbouring fingers stay within [same fret, LIM] semitones of each other (1–2: 3, 2–3: 2, 3–4: 3; together the
   8-semitone span), never crossing; two fingers on one string need a fret between them; the thumb stays within ±3 of
   finger 2. Dragging a finger past a limit pushes or pulls its neighbour, which can push or pull the next: drag far enough
   and the whole hand travels. Fingers snap to strings and to the spot behind a fret; the thumb slides freely. */
const LIM=[0,3,2,3];
const reach=(a,b)=>{ let r=0; for(let k=a;k<b;k++) r+=LIM[k]; return r; };
function fingersFit(a,fa,sa,b,fb,sb){
  if(a===b) return false; if(a>b) return fingersFit(b,fb,sb,a,fa,sa);
  const gap=fb-fa; if(gap<0) return false; if(sa===sb&&gap<1) return false;
  return gap<=reach(a,b);
}
const HAND={f:[null,{fret:5,string:0},{fret:6,string:0},{fret:7,string:0},{fret:8,string:0}],thumb:5.5};
const cloneHand=H=>({f:H.f.map(x=>x&&{fret:x.fret,string:x.string}),thumb:H.thumb});
let P=[];                                                              // the pairings: {g: finger (0 = open string), s, f}
let MEANS='pick', DRILL=null, SEL=null;                                // DRILL: the complete structure, its plan built
let SAMPLES=[], SI=0, CUSTOM=false;                                    // the sampling Advance walks; CUSTOM: the drill was edited
const paired=g=>P.some(p=>p.g===g);
function unpair(g){ if(!g) return; const n=P.length; P=P.filter(p=>p.g!==g); if(P.length!==n) DRILL=null; }
// a finger dragged: it is held where it is; placed fingers that can no longer share the hand with it are let go (the
// farthest first); the hand then forms around what is left — rigid if nothing else is placed, stretched only as needed
function dragTo(k,s,f){
  unpair(k);
  const fits=()=>{ const fx=P.filter(p=>p.g).concat([{g:k,s,f}]); for(let i=0;i<fx.length;i++) for(let j=i+1;j<fx.length;j++) if(!fingersFit(fx[i].g,fx[i].f,fx[i].s,fx[j].g,fx[j].f,fx[j].s)) return false; return true; };
  while(!fits()){ const far=P.filter(p=>p.g).sort((a,b)=>Math.abs(b.g-k)-Math.abs(a.g-k))[0]; unpair(far.g); }
  const H=handFor(P.filter(p=>p.g).concat([{g:k,s,f}])); HAND.f=H.f; HAND.thumb=H.thumb;
}
function relayout(){ const H=handFor(P); HAND.f=H.f; HAND.thumb=H.thumb; }
// a resting hand for a set of placements: the placed fingers where they are, the others one to a fret around them, on the
// string of the nearest placed finger
// the hand as the placements make it: nothing placed, the resting shape — four fingers on four neighbouring frets, at base
// (or where finger 1 is now); placed fingers where they are, the others one to a fret around the nearest placed one. A
// stretch appears only where two placed fingers need it, and goes as soon as one of them is let go.
function handFor(pl,base,str){
  const H={f:[null,null,null,null,null],thumb:0}, fixed={};
  if(!pl.some(p=>p.g)){ let b=Math.round(base!==undefined?base:HAND.f[1].fret); b=Math.max(1,Math.min(FMAX-3,b)); const s=str!==undefined?str:HAND.f[1].string;
    for(let k=1;k<=4;k++) H.f[k]={fret:b+k-1,string:s}; H.thumb=b+0.5; return H; }
  pl.forEach(p=>{ if(p.g&&!fixed[p.g]) fixed[p.g]={fret:p.f,string:p.s}; });   // a sliding finger: where it starts
  const ks=Object.keys(fixed).map(Number);
  for(let k=1;k<=4;k++){
    if(fixed[k]){ H.f[k]={fret:fixed[k].fret,string:fixed[k].string}; continue; }
    const a=ks.reduce((b,x)=>Math.abs(x-k)<Math.abs(b-k)?x:b,ks[0]);
    H.f[k]={fret:fixed[a].fret+(k-a),string:fixed[a].string};
  }
  for(let k=2;k<=4;k++) if(!fixed[k]){ const same=H.f[k].string===H.f[k-1].string; H.f[k].fret=Math.max(H.f[k].fret,H.f[k-1].fret+(same?1:0)); }
  for(let k=3;k>=1;k--) if(!fixed[k]){ const same=H.f[k].string===H.f[k+1].string; H.f[k].fret=Math.min(H.f[k].fret,H.f[k+1].fret-(same?1:0)); }
  for(let k=1;k<=4;k++) if(!fixed[k]) H.f[k].fret=Math.max(1,Math.min(FMAX,H.f[k].fret));
  H.thumb=(H.f[1].fret+H.f[2].fret)/2;
  return H;
}

/* ---------- pairing ----------
   A completion is one way of playing the structure: its two tones, each with its finger (0: open), and the means of the
   step between them — pick (fret), slide (one finger carries the length) or bend (one finger, the upper tone a push of
   the lower fret; a prebend is the bend with the upper tone on the downbeat). A finger or fret pulses if and only if it
   belongs to at least one completion still possible given the pairings made and the hand's limits. */
function completions(){
  const out=[];
  for(const r of instances()){ const L=r.lo, H=r.hi, same=L.s===H.s;
    const gl=L.f?[1,2,3,4]:[0], gh=H.f?[1,2,3,4]:[0];
    for(const a of gl) for(const b of gh){ if(a&&b&&!fingersFit(a,L.f,L.s,b,H.f,H.s)) continue; if(!a&&!b) continue;
      out.push({r,lo:{s:L.s,f:L.f,g:a},hi:{s:H.s,f:H.f,g:b},means:'pick'}); }
    if(same&&L.f>=1) for(let a=1;a<=4;a++){
      out.push({r,lo:{s:L.s,f:L.f,g:a},hi:{s:H.s,f:H.f,g:a},means:'slide'});
      out.push({r,lo:{s:L.s,f:L.f,g:a},hi:{s:H.s,f:L.f,g:a,push:1},means:'bend'}); }
  }
  return out;
}
const placementsOf=c=>{ const a=[c.lo]; if(!(c.hi.s===c.lo.s&&c.hi.f===c.lo.f&&c.hi.g===c.lo.g)) a.push(c.hi); return a; };
const samePl=(p,q)=>p.g===q.g&&p.s===q.s&&p.f===q.f;
function consistent(c){
  const pl=placementsOf(c);
  return P.every(p=>pl.some(q=>samePl(p,q))||(c.means==='bend'&&p.g===c.lo.g&&p.s===c.lo.s&&p.f===c.lo.f+1));   // a finger on the upper tone may bend it from the fret below
}
const realized=c=>placementsOf(c).every(q=>P.some(p=>samePl(p,q)));
let COMP=[];
function candidates(){
  const C=COMP.filter(c=>c.means===MEANS&&consistent(c));
  const fingers=new Set(), cells=new Map();
  if(!FIELD.on&&!P.length) return {C,fingers,cells};                    // without the field nothing is preferred until the first pairing
  C.forEach(c=>placementsOf(c).forEach(q=>{ if(P.some(p=>samePl(p,q))) return;
    if(q.g) fingers.add(q.g); const k=q.s+':'+q.f; if(!cells.has(k)) cells.set(k,new Set()); cells.get(k).add(q.g); }));
  return {C,fingers,cells};
}

function canPair(g,s,f){ const p={g,s,f}; P.push(p); const ok=COMP.some(c=>c.means===MEANS&&consistent(c)); P.pop(); return ok; }
// the drill a completion makes: each tone with its string, fret, sounding pitch (fret + push) and finger
function makeDrill(c){
  const D={r:c.r,lo:Object.assign({},c.lo),hi:Object.assign({},c.hi),means:c.means,ham:false,pull:false};
  if(D.means!=='pick'||D.lo.s!==D.hi.s){ D.ham=false; D.pull=false; } else { D.ham=LEGATO.ham; D.pull=LEGATO.pull; }
  return D;
}
const LEGATO={ham:false,pull:false};
// the notes in playing order: the two tones alternating through the figure (Up: the lower first; Down: the upper first)
function planOf(D,dir){
  const first=dir==='up'?D.lo:D.hi, second=dir==='up'?D.hi:D.lo, mid=x=>midiOf(x.s,x.f)+(x.push||0);
  return FIG.map((e,i)=>{ const x=i%2?second:first, q=i%2?first:second;
    const n={string:x.s,fret:x.f,pitch:x.f+(x.push||0),push:x.push||0,finger:x.g,pick:true,glide:false,pre:false,kind:'pick',hi:x===D.hi};
    if(D.means==='slide'||D.means==='bend'){
      if(!BAR_START(i)){ n.pick=false; n.glide=true; n.kind=D.means==='slide'?'slide':(x===D.hi?'bend':'release'); }
      else if(D.means==='bend'&&x===D.hi){ n.pre=true; n.kind='pre'; } }
    else if(x.s===q.s){ const up=mid(x)>mid(q); if(up&&D.ham){ n.pick=false; n.kind='ham'; } else if(!up&&D.pull){ n.pick=false; n.kind='pull'; } }
    return n; });
}
// the default fingering of a place, for a means
function fingeringOf(r,means){
  const L=r.lo, H=r.hi;
  if(means==='slide') return {lo:{s:L.s,f:L.f,g:1},hi:{s:H.s,f:H.f,g:1}};
  if(means==='bend'){ const g=Math.min(3,L.f); return {lo:{s:L.s,f:L.f,g},hi:{s:L.s,f:L.f,g,push:1}}; }
  if(!L.f) return {lo:{s:L.s,f:0,g:0},hi:{s:H.s,f:H.f,g:1}};
  if(!H.f) return {lo:{s:L.s,f:L.f,g:1},hi:{s:H.s,f:0,g:0}};
  if(L.s===H.s) return {lo:{s:L.s,f:L.f,g:1},hi:{s:H.s,f:H.f,g:2}};
  const gap=Math.abs(L.f-H.f), lowLo=L.f<=H.f, other=Math.min(4,1+gap);
  return lowLo?{lo:{s:L.s,f:L.f,g:1},hi:{s:H.s,f:H.f,g:other}}:{lo:{s:L.s,f:L.f,g:other},hi:{s:H.s,f:H.f,g:1}};
}

/* ---------- the sampling Advance walks ----------
   Not exhaustive: one default fingering per place, chosen to show the variety a player should know. Its backbone is the
   unison family — the same two pitches in every place they live. Ordered by lean, each step moves exactly one tone to the
   next string, so the cross-string place is the half-way lean. One rule for every structure:
   1. home: the family's place on one string nearest the middle of the neck, picked;
   2. lean back one tone at a time to the far end (at an open string: the hammer-on from it and pull-off to it);
   3. home again for the one-string techniques: hammer-on and pull-off, slide, bend, prebend and release;
   4. lean forward to the family's other end;
   5. the other (octave) families, each leaning back. */
function sampling(){
  const fams=new Map();
  instances().forEach(r=>{ const m=midiOf(r.lo.s,r.lo.f); if(!fams.has(m)) fams.set(m,[]); fams.get(m).push(r); });
  const key=r=>r.lo.s+r.hi.s;                                           // larger: toward the low strings, leaning forward
  const list=[...fams.keys()].sort((a,b)=>a-b).map(m=>fams.get(m).sort((a,b)=>key(b)-key(a)));
  let home=null, best=1e9;
  const heard=r=>relOf(pcOf(r.lo.s,r.lo.f))===HEAR[hearing].lo;      // home is always a place of the chosen hearing, field on or off
  list.forEach((F,fi)=>F.forEach((r,ri)=>{ if(r.lo.s!==r.hi.s||!heard(r)) return; const d=Math.pow(r.lo.s-(NSTR-1)/2,2)+0.25*Math.pow((r.lo.f+r.hi.f)/2-6,2); if(d<best){ best=d; home={fi,ri}; } }));
  const S=[], add=(r,means,o)=>S.push(Object.assign({r,means,dir:'up',ham:false,pull:false},o||{}));
  if(!home) return S;

/* ZOOM: a double tap on the TAB, the Ring or the fretboard brings it up to fill the screen; a double tap on it there (or

   returned to its place after. The fretboard is drawn to the screen's height, wider than the screen: it opens on the hand
   and scrolls left and right, and when the hand moves to a new place it follows it. The TAB is drawn large the same way and
   follows the playhead; the Ring fits the screen. The page's Play, Hold and Prev | Next come along in a bar at the foot of
   the zoomed view (copies that press the page's own, kept in step with them); a page may add its own (a button with
   data-zoom, or data-zoom="fb" to come along only with the board). The Ring brings its own controls instead — Diatonic,
   1|5 and Ghost, the page's own buttons moved down into the bar while it is zoomed and back after. On Chords, with the board turned a quarter, the turned board is what fills the screen. A song's strumming
   pattern and its circle zoom the same way (attached by the Chords page as it makes them): the notation as wide as the

    else { const svg=cur.querySelector('svg'), v=vbOf(svg); let h=H*0.7, w=h*v.w/v.h; if(w<W*0.96){ w=W*0.96; h=w*v.h/v.w; }
      cur.style.width=w+'px'; cur.style.maxWidth='none'; cur.style.overflow='visible'; svg.style.width=w+'px'; svg.style.height=h+'px'; svg.style.maxWidth='none'; } }

/* THE ROOM: the strings sound in a room — the site's studio room (ir/studio-room.js, the impulse the lessons use: image
   sources and ray tracing, about a second to die away, the highs first). The strings' sound is sent through it and back
   under the dry sound; the click stays dry. Its level is the gear's Room slider (a moderate 30 at first, remembered).
   The impulse file is fetched beside the page; until it has come (or where it cannot), a soft synthetic room stands in. */
(()=>{
  if(typeof ensureCtx!=='function') return;
  let R=0.3; try{ const v=localStorage.getItem('tech-room'); if(v!==null&&isFinite(+v)) R=Math.max(0,Math.min(1,+v)); }catch(e){}
  let conv=null, wet=null, real=false;
  const level=r=>0.55*r;                                                  // the wet send at the slider's value
  function roomBuf(){ const D=window.TF_ROOM_IR; if(!D||!D.ch||!ctx) return null;
    const sr=ctx.sampleRate, ratio=D.sr/sr, n=Math.floor(D.n/ratio), buf=ctx.createBuffer(2,n,sr);
    for(let c=0;c<2;c++){ const bin=atob(D.ch[c]), m=bin.length>>1, src=new Float32Array(m);
      for(let i=0;i<m;i++){ let v=bin.charCodeAt(2*i)|(bin.charCodeAt(2*i+1)<<8); if(v>32767) v-=65536; src[i]=v/32767; }
      const d=buf.getChannelData(c);
      for(let k=0;k<n;k++){ const x=k*ratio, i0=Math.floor(x), f=x-i0; d[k]=i0+1<m?src[i0]*(1-f)+src[i0+1]*f:(i0<m?src[i0]:0); } }
    return buf; }
  function synthBuf(){ const sr=ctx.sampleRate, L=Math.floor(sr*2.2), b=ctx.createBuffer(2,L,sr);
    for(let ch=0;ch<2;ch++){ const d=b.getChannelData(ch), cf=1-Math.exp(-2*Math.PI*4800/sr); let lp=0;
      for(let k=0;k<L;k++){ const t=k/sr; lp+=cf*((Math.random()*2-1)-lp); d[k]=lp*Math.exp(-t/0.6)*(k<500?k/500:1); } }
    return b; }
  function attach(){
    if(!ctx||conv||!stringBus||!master) return;
    const hp=ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=140;
    conv=ctx.createConvolver(); const b=roomBuf(); conv.buffer=b||synthBuf(); real=!!b;
    wet=ctx.createGain(); wet.gain.value=level(R);
    stringBus.connect(hp); hp.connect(conv); conv.connect(wet); wet.connect(master); }
  function upgrade(){ if(conv&&!real){ const b=roomBuf(); if(b){ conv.buffer=b; real=true; } } }
  const orig=ensureCtx;
  ensureCtx=function(){ return orig.apply(this,arguments).then(r=>{ attach(); return r; }); };
  // the impulse, fetched beside the page (a published page sits one folder below the site; its source two)
  if(!window.TF_ROOM_IR){ const paths=['../ir/studio-room.js','../../ir/studio-room.js']; let k=0;
    const next=()=>{ if(k>=paths.length) return; const s=document.createElement('script'); s.src=paths[k++]; s.async=true;
      s.onload=()=>{ if(window.TF_ROOM_IR) upgrade(); else next(); }; s.onerror=()=>{ s.remove(); next(); }; document.head.appendChild(s); };
    next(); }
  // the gear: Room, under the strings' own level
  const after=document.getElementById('volString'), row0=after&&after.closest('.mixRow');
  if(row0){ const row=document.createElement('div'); row.className='mixRow';
    row.innerHTML='<span class="name">Room</span><input type="range" id="volRoom" min="0" max="100" aria-label="Room reverb"><b id="volRoomV"></b><span></span>';
    row0.after(row); const sl=row.querySelector('input'), out=row.querySelector('b');
    const show=()=>{ sl.value=Math.round(R*100); out.textContent=Math.round(R*100); }; show();
    sl.addEventListener('input',()=>{ R=+sl.value/100; out.textContent=sl.value; try{ localStorage.setItem('tech-room',String(R)); }catch(e){}
      if(wet&&ctx) wet.gain.setTargetAtTime(level(R),ctx.currentTime,0.04); }); }
})();


/* THE RING'S HAND (the line from the centre to the tone sounding, or the mode's root): a hairline, one and a quarter screen
   pixels, rising from nothing at the centre to the ink at the letter; drawn under the solfège names, whose outline in the
   page's colour parts it cleanly where it passes behind one. The centre's dot a little smaller. */

let lefty=false; try{ lefty=new URLSearchParams(location.search).get('hand')==='left'; localStorage.removeItem('semitone-hand'); }catch(err){}
function syncHand(){ fbEl.classList.toggle('lefty',lefty); for(const b of segHand.querySelectorAll('button')) b.setAttribute('aria-pressed',(b.dataset.v==='left')===lefty); }
segHand.addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; lefty=b.dataset.v==='left'; syncHand(); });
syncHand();
// g(x): off by default, so the field is a choice made against the world without it (remembered on this device)
const gxBtn=$('gx'), eqn=$('eqn');
try{ FIELD.on=localStorage.getItem('structures-gx')==='on'; }catch(err){}
function syncGx(){ gxBtn.setAttribute('aria-pressed',FIELD.on); eqn.classList.toggle('on',FIELD.on); listenEl.hidden=!FIELD.on; document.body.classList.toggle('gxOn',FIELD.on); }
gxBtn.addEventListener('click',()=>{ FIELD.on=!FIELD.on;   // colour only: playback carries on
  try{ localStorage.setItem('structures-gx',FIELD.on?'on':'off'); }catch(err){} syncGx();
  const keep=DRILL; SAMPLES=sampling(); if(keep){ const i=SAMPLES.findIndex(x=>x.r.lo.s===keep.lo.s&&x.r.lo.f===keep.lo.f&&x.r.hi.s===keep.hi.s&&x.r.hi.f===keep.hi.f); if(i>=0) SI=i; } else if(!T.on){ P=[]; settle(); } refresh(); });
try{ if(localStorage.getItem('structures-ring')==='chain'){ RING.goal=RING.m=RING.t=1; } }catch(err){}
const segStrobe=document.getElementById('segStrobe');
function syncStrobe(){ for(const b of segStrobe.querySelectorAll('button')) b.setAttribute('aria-pressed',(b.dataset.v==='show')===showStrobe); }
segStrobe.addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; showStrobe=b.dataset.v==='show'; try{ localStorage.setItem('semitone-strobe',showStrobe?'show':'hide'); }catch(err){} syncStrobe(); });
syncStrobe();
syncGx();
/* FIT: on a screen wider than the page, the whole page — title to fretboard — scales up to the window, until it meets the
   width or the height, whichever comes first (the settings panel, when open, is left out of the measure). Narrower
   windows keep the page as it is. */
let ZOOM=1; const afterFit=[];
{ const wrapEl=document.querySelector('.wrap'), mixerEl=document.getElementById('mixer'); let pend=0;
  const fit=()=>{ pend=0; const r=wrapEl.getBoundingClientRect(), h=r.height/ZOOM-(mixerEl&&!mixerEl.hidden?mixerEl.getBoundingClientRect().height/ZOOM+18:0);
    const s=window.innerWidth<=980?1:Math.max(1,Math.min(3,window.innerWidth/980,(window.innerHeight-4)/Math.max(300,h)));
    if(Math.abs(s-ZOOM)>0.004){ ZOOM=s; wrapEl.style.zoom=s===1?'':s.toFixed(4); }
    afterFit.forEach(f=>f()); };
  const later=()=>{ if(!pend) pend=requestAnimationFrame(fit); };
  window.addEventListener('resize',later); new ResizeObserver(later).observe(wrapEl);
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(later); later(); }
SAMPLES=sampling(); COMP=completions(); applySample(0);
placeRing();
})();

</script>
