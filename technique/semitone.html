<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Semitone Drills</title>
<link rel="icon" href="../favicon.ico">
<style>
/* Layout: one column — the name, a control bar (Drill, Test, the drill's settings, a gear that opens the mixer), then a stage:
   instructions in the left three quarters and the chromatic ring in the right quarter (no words on the ring), then the fretboard with the floating hand above the high e and the
   thumb below the low E, then the two-bar TAB as a subdivision grid. Grayscale only: g(x) is off. */
:root{
  color-scheme:light;
  --bg:#ffffff;
  --ink:#121212;
  --mid:#6e6e6e;
  --faint:#d4d4d4;
  --board:#f2f2f2;
  --sans:"Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#0f0f0f; --ink:#ededed; --mid:#9b9b9b; --faint:#3a3a3a; --board:#1a1a1a; color-scheme:dark }
}
:root[data-theme="dark"]{ --bg:#0f0f0f; --ink:#ededed; --mid:#9b9b9b; --faint:#3a3a3a; --board:#1a1a1a; color-scheme:dark }

*{ box-sizing:border-box }
[hidden]{ display:none !important }
body{ margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans); font-size:15px; line-height:1.4; font-variant-numeric:tabular-nums }
.wrap{ max-width:980px; margin:0 auto; padding-inline:16px; padding-block:22px 44px; display:grid; gap:18px }
header{ display:grid; gap:2px }
.eyebrow{ margin:0; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--mid) }
h1{ margin:0; font-size:30px; font-weight:700; letter-spacing:-.01em; line-height:1.1; text-wrap:balance }
.stage{ display:grid; grid-template-columns:3fr 1fr; gap:16px 28px; align-items:center }
.ringBox{ display:flex; justify-content:center; min-width:0 }
.ringBox svg{ width:100%; max-width:264px; height:auto }
.ins{ min-width:0; display:grid; gap:8px; align-content:start; min-height:9.5em }
.ins h2{ margin:0; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--mid); font-weight:600 }
.insFacts{ margin:0; font-weight:600 }
.insHow{ margin:0; max-width:64ch }
.insHow span{ color:var(--mid) }
.insTest{ margin:0; justify-self:start; font-size:13px; font-weight:700; padding:4px 10px; border:1.5px solid var(--ink); border-radius:999px }
@media (max-width:640px){ .stage{ grid-template-columns:1fr } .ringBox svg{ max-width:220px } }
.bar{ display:flex; flex-wrap:wrap; align-items:center; gap:10px 20px; padding-block:12px; border-top:1px solid var(--faint); border-bottom:1px solid var(--faint) }
.play{ font:inherit; font-weight:700; min-width:92px; padding:8px 18px; border:2px solid var(--ink); background:var(--ink); color:var(--bg); border-radius:999px; cursor:pointer }
.play.on{ background:var(--bg); color:var(--ink) }
.gear{ font:inherit; font-size:18px; line-height:1; width:36px; height:36px; margin-left:auto; border:1px solid var(--mid); border-radius:50%; background:var(--bg); color:var(--ink); cursor:pointer }
.gear[aria-expanded="true"]{ background:var(--ink); color:var(--bg); border-color:var(--ink) }
button:focus-visible, input:focus-visible{ outline:2px solid var(--ink); outline-offset:2px }
.ctl{ display:flex; align-items:center; gap:8px; color:var(--mid); font-size:13px; margin:0 }
.ctl b{ color:var(--ink); font-weight:600; min-width:2.2em; text-align:right }
.ctl.off{ color:var(--faint) }
.seg{ display:inline-flex; border:1px solid var(--mid); border-radius:6px; overflow:hidden }
.seg button{ font:inherit; font-size:13px; padding:5px 11px; border:0; border-left:1px solid var(--mid); background:var(--bg); color:var(--ink); cursor:pointer }
.seg button:first-child{ border-left:0 }
.seg button[aria-pressed="true"]{ background:var(--ink); color:var(--bg) }
.seg button:disabled{ color:var(--faint); cursor:default }
.seg button:disabled[aria-pressed="true"]{ background:var(--faint); color:var(--bg) }
input[type=range]{ accent-color:var(--ink); width:130px }
input[type=checkbox]{ accent-color:var(--ink) }
.mixer{ display:grid; gap:10px; padding:14px 16px; border:1px solid var(--mid); border-radius:8px; max-width:540px; margin-top:-6px }
.mixer h2{ margin:0 0 2px; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--mid); font-weight:600 }
.mixRow{ display:grid; grid-template-columns:7em 1fr 3.8em auto; align-items:center; gap:12px; font-size:13px }
.mixRow .name{ color:var(--ink); font-weight:600 }
.mixRow input[type=range]{ width:100%; min-width:0 }
.mixRow b{ text-align:right; font-weight:600; white-space:nowrap }
.mixRow label{ display:flex; align-items:center; gap:6px; color:var(--mid) }
.mixRow.sub .name{ color:var(--mid); font-weight:400 }
.mixRow.sub .seg{ grid-column:2 / -1; justify-self:start }
@media (max-width:480px){ .mixRow{ grid-template-columns:5.5em 1fr 3.8em auto; gap:8px } }
.panel{ width:100%; min-width:0; overflow:hidden }
svg{ display:block; width:100%; height:auto; max-width:100%; font-family:var(--sans) }

/* SVG parts, all through the tokens */
.ink{ fill:var(--ink) } .mid{ fill:var(--mid) } .board{ fill:var(--board) }
.inkS{ stroke:var(--ink) } .midS{ stroke:var(--mid) } .faintS{ stroke:var(--faint) }
.fingerC{ fill:var(--bg); stroke:var(--ink); stroke-width:1.6 } .fingerC.down{ fill:var(--ink) }
.fingerN{ fill:var(--ink); font-weight:700; font-size:15px; text-anchor:middle; dominant-baseline:central; pointer-events:none } .fingerN.down{ fill:var(--bg) }
.guide{ stroke:var(--faint); stroke-dasharray:2 3 }
.fretn{ fill:var(--mid); font-size:10px; text-anchor:middle }
.lbl{ fill:var(--mid); font-size:11px } .lbl.sel{ fill:var(--ink); font-weight:700 }
.clef{ fill:var(--ink); font-size:24px; font-weight:700; text-anchor:middle; dominant-baseline:central }
.row{ stroke:var(--mid) } .row.sel{ stroke:var(--ink) }
.hit{ fill:transparent; cursor:pointer }
.num{ fill:var(--ink); font-weight:700; font-size:14px; text-anchor:middle; dominant-baseline:central; pointer-events:none }
.knock{ fill:var(--bg) } .knock.on{ fill:var(--faint) }
.tsig{ fill:var(--ink); font-size:24px; font-weight:700; text-anchor:middle; dominant-baseline:central }
.bendLbl{ fill:var(--ink); font-size:13px; font-weight:700; text-anchor:middle; dominant-baseline:central }
.curve{ fill:none; stroke:var(--ink); stroke-width:1.3 }
.headS{ stroke:var(--mid) }
.dot{ fill:var(--bg); stroke:var(--ink); stroke-width:1.4 } .dot.on{ fill:var(--ink) }
.rl{ fill:var(--mid); text-anchor:middle; dominant-baseline:central } .rl.pair{ fill:var(--ink) } .rl.on{ fill:var(--ink); font-weight:700 }
.rd{ fill:var(--mid) } .rd.on{ fill:var(--ink) }
.hand{ stroke:var(--ink); stroke-width:1.5; stroke-dasharray:4 3; stroke-linecap:round }
.wedge{ fill:none; stroke:var(--ink); stroke-width:2 }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <p class="eyebrow">Harmonic structure · 1 of 7</p>
    <h1>Semitone</h1>
  </header>

  <div class="bar">
    <button id="play" class="play" type="button">Drill</button>
    <button id="test" class="play" type="button">Test</button>
    <label class="ctl" for="bpm">Tempo <input type="range" id="bpm" min="40" max="140" value="70"> <b id="bpmv">70</b></label>
    <label class="ctl" for="click"><input type="checkbox" id="click" checked> Click</label>
    <div class="ctl">String
      <div class="seg" id="segString" role="group" aria-label="String">
        <button type="button" data-v="0">e</button><button type="button" data-v="1">B</button><button type="button" data-v="2">G</button><button type="button" data-v="3">D</button><button type="button" data-v="4">A</button><button type="button" data-v="5">E</button>
      </div>
    </div>
    <div class="ctl">Starting finger
      <div class="seg" id="segStart" role="group" aria-label="Starting finger">
        <button type="button" data-v="1">1</button><button type="button" data-v="2">2</button><button type="button" data-v="3">3</button><button type="button" data-v="4">4</button>
      </div>
    </div>
    <div class="ctl">Direction
      <div class="seg" id="segDir" role="group" aria-label="Direction">
        <button type="button" data-v="up">Up</button><button type="button" data-v="down">Down</button>
      </div>
    </div>
    <div class="ctl" id="plantCtl">Lower finger
      <div class="seg" id="segPlant" role="group" aria-label="Lower finger">
        <button type="button" data-v="1">Stays down</button><button type="button" data-v="0">Lifts</button>
      </div>
    </div>
    <label class="ctl" for="slide"><input type="checkbox" id="slide"> Slide</label>
    <label class="ctl" for="bend"><input type="checkbox" id="bend"> Bend</label>
    <button id="gear" class="gear" type="button" aria-expanded="false" aria-controls="mixer" title="Sound">&#x2699;&#xFE0E;</button>
  </div>

  <div class="mixer" id="mixer" hidden>
    <h2>Sound</h2>
    <div class="mixRow"><span class="name">Global</span><input type="range" id="volMaster" min="0" max="100" value="80"><b id="volMasterV">80</b><label><input type="checkbox" id="muteMaster"> Mute</label></div>
    <div class="mixRow"><span class="name">Fretboard</span><input type="range" id="volString" min="0" max="100" value="80"><b id="volStringV">−8 dB</b><label><input type="checkbox" id="muteString"> Mute</label></div>
    <div class="mixRow sub"><span class="name">Instrument</span>
      <div class="seg" id="segInst" role="group" aria-label="Instrument">
        <button type="button" data-v="acoustic">Acoustic</button><button type="button" data-v="archtop">Archtop</button>
      </div>
    </div>
    <div class="mixRow"><span class="name">Click</span><input type="range" id="volClick" min="0" max="100" value="80"><b id="volClickV">80</b><label><input type="checkbox" id="muteClick"> Mute</label></div>
    <div class="mixRow sub"><span class="name">Click sound</span>
      <div class="seg" id="segClick" role="group" aria-label="Click sound">
        <button type="button" data-v="click">Click</button><button type="button" data-v="hat">Hi-hat</button><button type="button" data-v="kick">Kick drum</button>
      </div>
    </div>
  </div>

  <div class="stage">
    <section class="ins" aria-live="polite">
      <p class="insTest" id="insTest" hidden></p>
      <h2>Instructions</h2>
      <p class="insFacts" id="insFacts"></p>
      <p class="insHow" id="insHow"></p>
    </section>
    <div class="ringBox"><svg id="ring" viewBox="0 0 240 240" aria-label="Chromatic ring: the twelve pitch names around a circle, A at the top, with a dashed hand on the sounding pitch"></svg></div>
  </div>

  <div class="panel"><svg id="fb" viewBox="0 0 900 304" aria-label="Fretboard, position 5, with the fret-hand's four fingers floating above the high e and the thumb behind the neck"></svg></div>
  <div class="panel"><svg id="tab" viewBox="0 0 900 194" aria-label="Two bars of TAB in 4/4, with rhythm stems below the staff"></svg></div>

</div>

<script>
(function(){
'use strict';
const NS='http://www.w3.org/2000/svg';
const el=(tag,attrs,parent)=>{const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;};
const reduce=!!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches);

/* ---------- the drill ----------
   Hand: position 5 (the index finger's fret), one finger per fret, so finger f sits at fret POSITION+f-1.
   A semitone drill is a pair of adjacent frets on one string: the starting finger's fret and its neighbour in the chosen direction.
   Fingers: the two frets belong to two adjacent fingers.  Slide: the starting finger holds both frets, the whole hand moving with it.
   Bend: the finger on the lower fret stays there and bends the string up to the upper pitch (Down: a prebend, then release).
   Figure: bar 1 eight straight eighths, bar 2 two halves; the two frets alternate through all ten notes, and the figure loops. */
const POSITION=5;
const STRINGS=[{lbl:'e',name:'high e',hz:329.6276,pc:7},{lbl:'B',name:'B',hz:246.9417,pc:2},{lbl:'G',name:'G',hz:195.9977,pc:10},{lbl:'D',name:'D',hz:146.8324,pc:5},{lbl:'A',name:'A',hz:110.0,pc:0},{lbl:'E',name:'low E',hz:82.4069,pc:7}]; // pc = semitones above A
const NAMES=['A','A♯/B♭','B','C','C♯/D♭','D','D♯/E♭','E','F','F♯/G♭','G','G♯/A♭'];
const fretHz=(s,n)=>STRINGS[s].hz*Math.pow(2,n/12);
const pcOf=(s,fret)=>((STRINGS[s].pc+fret)%12+12)%12;   // fret may be fractional, mid-slide
const FIG=[{s:0,d:.5},{s:.5,d:.5},{s:1,d:.5},{s:1.5,d:.5},{s:2,d:.5},{s:2.5,d:.5},{s:3,d:.5},{s:3.5,d:.5},{s:4,d:2},{s:6,d:2}]; // start, duration in beats
const BAR_START=i=>i===0||i===8;
const LOOP=8, COUNT=4, LEAD=0.06, SLIDE_T=0.09;          // loop beats, count-in beats, finger lands this far ahead of the pluck (s), slide travel time (s)
const drill={string:0,start:1,dir:'up',plant:true,slide:false,bend:false,bpm:70,click:true};
const pairOf=()=>{const a=drill.start,b=drill.dir==='up'?a+1:a-1;return [a,b].map(f=>({finger:f,fret:POSITION+f-1}));};
const validStart=s=>{const b=drill.dir==='up'?s+1:s-1;return b>=1&&b<=4;};

/* ---------- fretboard ---------- */
const FB={x0:40,nut:96,cw:66,n:12,top:80,bot:240,hover:36,strY:[98,122,146,170,194,218],gauge:[1,1.2,1.5,1.9,2.4,3]};
FB.right=FB.nut+FB.n*FB.cw;
const cellL=n=>n===0?FB.x0:FB.nut+(n-1)*FB.cw;
const cellR=n=>n===0?FB.nut:FB.nut+n*FB.cw;
const tipX=n=>cellL(n)+0.66*(cellR(n)-cellL(n));        // fingertip just behind the fret wire
const tipXf=fr=>{ const n=Math.floor(fr); return tipX(n)+(fr-n)*FB.cw; };   // mid-slide, between two fretted cells
const cellM=n=>(cellL(n)+cellR(n))/2;
const fb=document.getElementById('fb');
el('rect',{x:FB.x0,y:FB.top,width:FB.right-FB.x0,height:FB.bot-FB.top,class:'board'},fb);
for(let k=1;k<=FB.n;k++) el('line',{x1:FB.nut+k*FB.cw,y1:FB.top,x2:FB.nut+k*FB.cw,y2:FB.bot,class:'midS','stroke-width':1.5},fb);
el('line',{x1:FB.nut,y1:FB.top-8,x2:FB.nut,y2:FB.bot+8,class:'inkS','stroke-width':4},fb);   // nut line, past both edges
for(let k=1;k<=FB.n;k++){ const t=el('text',{x:cellM(k),y:FB.bot-5,class:'fretn'},fb); t.textContent=k; }
const strPath=(y,dx,dy)=>'M'+FB.x0+' '+y+' L'+FB.nut+' '+y+(dy?' L'+dx.toFixed(1)+' '+(y+dy).toFixed(1):'')+' L'+FB.right+' '+y;
const strLines=FB.strY.map((y,i)=>el('path',{d:strPath(y,0,0),fill:'none',class:'inkS','stroke-width':FB.gauge[i],'stroke-linecap':'round','stroke-linejoin':'round'},fb));
let bentStr=-1;
function bendString(i,x,dy){                                          // the string itself: straight to the nut, then to the fingertip pushed aside, then to the bridge
  if(bentStr>=0&&bentStr!==i) strLines[bentStr].setAttribute('d',strPath(FB.strY[bentStr],0,0));
  strLines[i].setAttribute('d',strPath(FB.strY[i],x,dy)); bentStr=dy?i:-1;
}
[3,5,7,9].forEach(k=>el('circle',{cx:cellM(k),cy:FB.bot+14,r:4,class:'mid'},fb));            // neck dots below the low E
el('circle',{cx:cellM(12)-7,cy:FB.bot+14,r:4,class:'mid'},fb);
el('circle',{cx:cellM(12)+7,cy:FB.bot+14,r:4,class:'mid'},fb);
const ringLine=el('line',{x1:0,y1:FB.strY[0],x2:FB.right,y2:FB.strY[0],class:'inkS','stroke-width':4,'stroke-linecap':'round',visibility:'hidden'},fb); // written note-on: fret to bridge

// the hand: four numbered fingers float above the high e in their positions
const fingers=[];
for(let f=1;f<=4;f++){
  const fret=POSITION+f-1, x=tipX(fret);
  const guide=el('line',{x1:x,y1:FB.hover+17,x2:x,y2:FB.strY[0]-6,class:'guide'},fb);
  const c=el('circle',{cx:x,cy:FB.hover,r:14,class:'fingerC'},fb);
  const t=el('text',{x:x,y:FB.hover,class:'fingerN'},fb); t.textContent=f;
  fingers.push({f,fret,home:x,x,y:FB.hover,c,t,guide});
}
// the thumb: behind the neck, below the low E, between fingers 1 and 2. It stays put when the hand slides.
// modes 'mute' and 'fret' are the over-the-top positions on the low E, wired but unused in this drill.
const thumb={mode:'behind',fret:POSITION};
function thumbPos(){
  const x12=(tipX(POSITION)+tipX(POSITION+1))/2;
  if(thumb.mode==='mute') return {x:x12,y:FB.strY[5]};
  if(thumb.mode==='fret') return {x:tipX(thumb.fret),y:FB.strY[5]};
  return {x:x12,y:FB.bot+44};
}
const thumbG=el('g',{},fb);
el('rect',{x:-17,y:-11,width:34,height:22,rx:11,class:'fingerC'},thumbG);
const thumbT=el('text',{x:0,y:0,class:'fingerN'},thumbG); thumbT.textContent='T';
function placeThumb(){ const p=thumbPos(); thumbG.setAttribute('transform','translate('+p.x+' '+p.y+')'); }
placeThumb();
// click a string to move the drill there
FB.strY.forEach((y,i)=>{ const h=el('rect',{x:FB.x0,y:y-12,width:FB.right-FB.x0,height:24,class:'hit'},fb); h.addEventListener('click',()=>setString(i)); });

/* ---------- the ring: a chromatic clock face, A at 12, ascending clockwise, π/6 per semitone ---------- */
const RG={c:120,R:84,RL:107,RW:58};
const ang=pc=>pc*Math.PI/6;
const pt=(r,pc)=>{ const a=ang(pc); return [RG.c+r*Math.sin(a),RG.c-r*Math.cos(a)]; };
const ringSvg=document.getElementById('ring');
el('circle',{cx:RG.c,cy:RG.c,r:RG.R,fill:'none',class:'faintS','stroke-width':1},ringSvg);
const rDots=[], rLbls=[];
for(let pc=0;pc<12;pc++){
  const [x,y]=pt(RG.R,pc); rDots.push(el('circle',{cx:x,cy:y,r:3,class:'rd'},ringSvg));
  const [lx,ly]=pt(RG.RL,pc); const parts=NAMES[pc].split('/'); const g=el('g',{},ringSvg); rLbls.push(g);
  if(parts.length===1){ const t=el('text',{x:lx,y:ly,class:'rl','font-size':14},g); t.textContent=parts[0]; }
  else{ const t1=el('text',{x:lx,y:ly-6.5,class:'rl','font-size':11},g); t1.textContent=parts[0]; const t2=el('text',{x:lx,y:ly+6.5,class:'rl','font-size':11},g); t2.textContent=parts[1]; }
}
const wedge=el('path',{d:'',class:'wedge'},ringSvg);                 // the drill's own semitone, drawn as its arc of the circle; no words
const hand=el('line',{x1:RG.c,y1:RG.c,x2:RG.c,y2:RG.c-RG.R,class:'hand',visibility:'hidden'},ringSvg);
el('circle',{cx:RG.c,cy:RG.c,r:3,class:'ink'},ringSvg);
function buildWedge(){
  const [a,b]=pairOf().map(n=>pcOf(drill.string,n.fret));
  const [x1,y1]=pt(RG.RW,a), [x2,y2]=pt(RG.RW,b);
  wedge.setAttribute('d','M'+x1.toFixed(1)+' '+y1.toFixed(1)+' A'+RG.RW+' '+RG.RW+' 0 0 '+(drill.dir==='up'?1:0)+' '+x2.toFixed(1)+' '+y2.toFixed(1));
  rLbls.forEach((g,pc)=>g.classList.toggle('pair',pc===a||pc===b));
}
function setHand(pcFloat,litPc){
  if(pcFloat===null){ hand.setAttribute('visibility','hidden'); rDots.forEach(d=>d.classList.remove('on')); rLbls.forEach(g=>g.classList.remove('on')); return; }
  const [x,y]=pt(RG.R,pcFloat); hand.setAttribute('x2',x); hand.setAttribute('y2',y); hand.setAttribute('visibility','visible');
  rDots.forEach((d,pc)=>d.classList.toggle('on',pc===litPc)); rLbls.forEach((g,pc)=>g.classList.toggle('on',pc===litPc));
}

/* ---------- TAB, engraved the way published tablature is ----------
   Six lines, the clef, 4/4, repeat bars; fret numbers sit on their line with the line broken behind them; no grid inside a bar;
   rhythm on stems below the staff (eighths beamed by the beat, half notes on short stems, as Guitar Pro prints them).
   Bends: a curved arrow from the number up above the staff, marked ½; a release comes back down to the fret in parentheses;
   a prebend is a straight arrow up from a picked number. Slides: a straight line from one number to the next. */
const TB={s0:40,s1:886,rowY:[64,81,98,115,132,149],dotY:10,topY:40};
TB.x0=TB.s0+86; TB.cw=(TB.s1-TB.x0)/16; TB.x1=TB.s1;
const xBeat=b=>TB.x0+TB.cw/2+b*2*TB.cw;                              // where a note on beat b is written; the playhead follows it
const tab=document.getElementById('tab');
const rows=[], rowLbls=[];
STRINGS.forEach((s,i)=>{
  rows.push(el('line',{x1:TB.s0,y1:TB.rowY[i],x2:TB.s1,y2:TB.rowY[i],class:'row','stroke-width':1},tab));
  const t=el('text',{x:TB.s0-8,y:TB.rowY[i],class:'lbl','text-anchor':'end','dominant-baseline':'central'},tab); t.textContent=s.lbl; rowLbls.push(t);
});
const midY=k=>(TB.rowY[k]+TB.rowY[k+1])/2;
['T','A','B'].forEach((ch,i)=>{ const t=el('text',{x:TB.s0+20,y:TB.rowY[0]+(TB.rowY[5]-TB.rowY[0])*(2*i+1)/6,class:'clef'},tab); t.textContent=ch; });
[['4',midY(1)],['4',midY(3)]].forEach(([d,y])=>{ const t=el('text',{x:TB.s0+50,y,class:'tsig'},tab); t.textContent=d; });   // 4/4

/* ---------- sound: a plucked string (Karplus–Strong), fractional delay so each fret is in tune ---------- */
const mix={master:{vol:80,mute:false},string:{vol:80,mute:false},click:{vol:80,mute:false,sound:'click'},inst:'acoustic'};
const stringGain=v=>v<=0?0:Math.pow(10,-40*(1-v/100)/20);         // log taper: 40 dB of travel, silent at the bottom
const stringDb=v=>{ if(v<=0) return 'off'; const db=-40*(1-v/100); return (db<=-0.5?'−'+Math.abs(db).toFixed(0):'0')+' dB'; };

/* ---------- the string: the Tonal Field tool's own model (v303 TFString), unchanged in its physics ----------
   A digital waveguide: one period of the pluck's shape (a triangle with its apex under the pick, plus a little filtered pick
   noise) enters a delay loop; each trip passes an allpass tuner (the loop filter's own delay subtracted, so intonation holds
   at every pitch and through every glide), a one-pole lowpass (the highs die first) and a loss set by the ring time. The
   GAUGE (0 the high e, 1 the low E) darkens the loop, softens the pick, moves it toward the middle and lengthens the ring.
   One string lives for the whole drill: a new note moves its length and picks it again; a slide moves its length only.
   Here the events (pluck, set, glide) carry audio-clock times, so the string runs sample-accurately ahead of the screen. */
/*CORE-BEGIN*/
function makeStringCore(){
  return class StringCore{
    constructor(sr,gauge){ this.sr=sr; this.N=8192; this.buf=new Float32Array(this.N); this.w=0; this.g=Math.max(0,Math.min(1,+gauge||0));
      this.lp=0; this.ap=0; this.apx=0; this.ex=new Float32Array(1); this.exN=0; this.exI=0; this.c=0.3; this.t60=3.5; this.f=220; this.gl=null; this.q=[]; this.dampTo=0; }
    push(e){ this.q.push(e); this.q.sort((a,b)=>a.t-b.t); }
    excite(f0,v){
      const g=this.g, pm=0; v=Math.max(0.05,Math.min(1,v));
      const fc=(2600+3400*(1-g))*(0.6+0.4*v)*Math.max(1,Math.pow(f0/110,0.7)); this.c=1-Math.exp(-2*Math.PI*Math.min(20000,fc*(1-0.85*pm))/this.sr);
      this.t60=(9+5*g)*Math.pow(0.03/(9+5*g),pm);
      const per=Math.max(2,Math.round(this.sr/f0)); this.exN=per; this.exI=0; this.ex=new Float32Array(per);
      const pick=0.14+0.14*g, pd=Math.max(1,Math.min(per-1,Math.round(per*pick)));
      const efc=(1500+2500*v)*(0.6+0.4*(1-g))*(1-0.6*pm), ec=1-Math.exp(-2*Math.PI*efc/this.sr);
      const n=new Float32Array(per+pd); let y=0; for(let i=0;i<n.length;i++){ y+=ec*((Math.random()*2-1)-y); n[i]=y; }
      const aT=0.7*(0.45+0.55*v)*(1-0.25*pm), aN=0.12*(0.45+0.55*v), fade=Math.max(2,Math.round(per*0.2));
      for(let k=0;k<per;k++){ const tri=(k<pd)?(k/pd):((per-k)/(per-pd)); const env=k<fade?0.5-0.5*Math.cos(Math.PI*k/fade):1;
        this.ex[k]=(tri-0.5)*aT+(n[k+pd]-n[k])*aN*env; }
    }
    render(out,t0){
      const sr=this.sr, N=this.N, buf=this.buf, q=this.q; let w=this.w, lp=this.lp, ap=this.ap, apx=this.apx;
      for(let i=0;i<out.length;i++){
        const t=t0+i/sr;
        while(q.length&&q[0].t<=t){ const e=q.shift();
          if(e.kind==='damp'){ this.dampTo=e.t1; }
          else if(e.kind==='glide'){ this.gl={t0:e.t,t1:e.t1,f0:this.f,f1:e.f}; }
          else{ this.gl=null; this.f=e.f; if(e.kind==='pluck') this.excite(e.f,e.v); } }
        let f=this.f;
        if(this.gl){ const G=this.gl; if(t>=G.t1){ f=this.f=G.f1; this.gl=null; } else { let u=Math.max(0,(t-G.t0)/(G.t1-G.t0)); u=u*u*(3-2*u); f=G.f0*Math.pow(G.f1/G.f0,u); } }
        const c=this.c, a=1-c;
        const om=2*Math.PI*f/sr, tau=Math.atan2(a*Math.sin(om),1-a*Math.cos(om))/om;
        let D=sr/f-tau; if(D<2.5)D=2.5; if(D>N-4)D=N-4;
        const M=Math.floor(D-0.5), eta=D-M, C=(1-eta)/(1+eta);
        const x=buf[(w-M+N)%N];
        const y=C*x+apx-C*ap; apx=x; ap=y;
        lp+=c*(y-lp);
        let v=lp*Math.pow(10,-3/(this.t60*f));
        if(t<this.dampTo) v*=0.99;
        if(this.exI<this.exN) v+=this.ex[this.exI++];
        buf[w]=v; out[i]=v; w=(w+1)%N;
      }
      this.w=w; this.lp=lp; this.ap=ap; this.apx=apx;
    }
  };
}
/*CORE-END*/
const WORKLET_SRC=makeStringCore.toString()+`
const StringCore=makeStringCore();
class TFDrillString extends AudioWorkletProcessor{
  constructor(o){ super(); const p=(o&&o.processorOptions)||{}; this.core=new StringCore(sampleRate,p.gauge); this.alive=true;
    this.port.onmessage=e=>{ const d=e.data; if(d==='stop') this.alive=false; else this.core.push(d); }; }
  process(ins,outs){ if(!this.alive) return false; this.core.render(outs[0][0],currentTime); return true; }
}
registerProcessor('tf-drill-string',TFDrillString);`;

/* ---------- the two instruments, both dry ----------
   Archtop: the tool's per-string body (three gentle peaks) into the tool's amp — a soft tanh stage, a low shelf, a
   presence bump and the cabinet's lowpass at 3.4 kHz. The tool's chorus and room are left out.
   Acoustic: no amp. The string's force at the bridge is convolved with the impulse response of a steel-string box —
   the air mode near 97 Hz and the top near 196 ringing longest, distinct modes up through the low mids, then the dense
   crowd of small modes that gives the top end its wood. All of the sound comes through the box, as it does from a real one. */
/*BODY-BEGIN*/
const ACOU_LOW=[[97,0.09,0.45],[196,0.07,0.5],[236,0.045,0.3],[290,0.04,0.35],[340,0.035,0.25],[410,0.03,0.32],[480,0.025,0.28],[560,0.022,0.3],[650,0.018,0.26],[720,0.016,0.22],[790,0.015,0.26],[900,0.013,0.2]];
function acousticIR(sr){
  const n=Math.floor(0.35*sr), ir=new Float32Array(n);
  let seed=7; const rnd=()=>{ seed=(seed*1103515245+12345)&0x7fffffff; return seed/0x7fffffff; };
  const add=(f,tau,amp)=>{ const ph=rnd()*2*Math.PI, wv=2*Math.PI*f/sr, L=Math.min(n,Math.ceil(tau*sr*7)); for(let i=0;i<L;i++) ir[i]+=amp*Math.exp(-i/(tau*sr))*Math.sin(wv*i+ph); };
  for(const [f,tau,amp] of ACOU_LOW) add(f,tau,amp);
  for(let k=0;k<260;k++){ const f=1000*Math.pow(10,rnd()*Math.log10(9)); add(f,0.012*Math.pow(1000/f,0.5),(0.10+0.08*rnd())*Math.pow(1000/f,0.25)); }   // 1–9 kHz, dense
  let e=0; for(let i=0;i<n;i++) e+=ir[i]*ir[i]; const s=1/Math.sqrt(e/40); for(let i=0;i<n;i++) ir[i]*=s;
  return ir;
}
const ARCH_MAKE=1.85, ACOU_MAKE=0.42;                               // level matching: both land where the earlier string sat on the fader (measured offline)
/*BODY-END*/

let ctx=null, master=null, stringBus=null, clickBus=null, archSel=null, acouSel=null, voiceIn=null, workletOK=false, noiseBuf=null;
function ensureCtx(){
  if(!ctx){
    const AC=window.AudioContext||window.webkitAudioContext; ctx=new AC(); const sr=ctx.sampleRate;
    master=ctx.createGain(); stringBus=ctx.createGain(); clickBus=ctx.createGain();
    stringBus.connect(master); clickBus.connect(master); master.connect(ctx.destination);
    voiceIn=ctx.createGain(); archSel=ctx.createGain(); acouSel=ctx.createGain();
    voiceIn.connect(archSel); voiceIn.connect(acouSel);
    const bq=(type,f,q,g)=>{ const b=ctx.createBiquadFilter(); b.type=type; b.frequency.value=f; if(q!==undefined) b.Q.value=q; if(g!==undefined) b.gain.value=g; return b; };
    const chain=(...nodes)=>{ for(let i=0;i<nodes.length-1;i++) nodes[i].connect(nodes[i+1]); return nodes[nodes.length-1]; };
    // archtop: the tool's body, then its amp (v387 headroom figures)
    const WSK=4, pre=ctx.createGain(); pre.gain.value=2.0/WSK;
    const ws=ctx.createWaveShaper(), cv=new Float32Array(4097); for(let i=0;i<cv.length;i++){ const x=(i/4096)*2-1; cv[i]=Math.tanh(1.6*WSK*x)/Math.tanh(1.6); } ws.curve=cv; ws.oversample='2x';
    const post=ctx.createGain(); post.gain.value=0.7; const bodyOut=ctx.createGain(); bodyOut.gain.value=1.3; const dry=ctx.createGain(); dry.gain.value=0.9*ARCH_MAKE;
    chain(archSel,bq('highpass',55,0.7),bq('peaking',118,2.2,3.5),bq('peaking',235,3,1.5),bq('peaking',2500,1.4,1.5),bodyOut,pre,ws,post,bq('lowshelf',220,undefined,3),bq('peaking',1200,0.8,1.5),bq('lowpass',3400,1.0),dry,stringBus);
    // acoustic: the box alone
    const conv=ctx.createConvolver(); conv.normalize=false; const ib=ctx.createBuffer(1,Math.floor(0.35*sr),sr); ib.getChannelData(0).set(acousticIR(sr)); conv.buffer=ib;
    const acOut=ctx.createGain(); acOut.gain.value=ACOU_MAKE;
    chain(acouSel,bq('highpass',55,0.7),conv,acOut,stringBus);
    applyMix(true);
  }
  const load=workletOK||!ctx.audioWorklet ? Promise.resolve() : (()=>{
    const blob=URL.createObjectURL(new Blob([WORKLET_SRC],{type:'application/javascript'}));
    const data='data:application/javascript;base64,'+btoa(unescape(encodeURIComponent(WORKLET_SRC)));
    return ctx.audioWorklet.addModule(blob).catch(()=>ctx.audioWorklet.addModule(data)).then(()=>{ workletOK=true; },()=>{ workletOK=false; });
  })();

}
function applyMix(now0){
  if(!ctx) return;
  const t=ctx.currentTime;
  const set=(node,v)=>{ if(now0) node.gain.setValueAtTime(v,t); else node.gain.setTargetAtTime(v,t,0.015); };
  set(master,mix.master.mute?0:mix.master.vol/100);
  set(stringBus,mix.string.mute?0:stringGain(mix.string.vol));
  set(archSel,mix.inst==='archtop'?1:0); set(acouSel,mix.inst==='acoustic'?1:0);
  set(clickBus,mix.click.mute?0:mix.click.vol/100);
}
// one string for the drill: in the audio worklet where allowed, otherwise the same core on the main thread
function makeString(gauge){
  const vg=ctx.createGain(); vg.gain.value=0.19*(0.35+0.65*PLUCK_V); vg.connect(voiceIn);   // the tool's voice level for this velocity
  if(workletOK){
    const node=new AudioWorkletNode(ctx,'tf-drill-string',{numberOfInputs:0,numberOfOutputs:1,outputChannelCount:[1],processorOptions:{gauge}});
    node.connect(vg);
    return {send:e=>node.port.postMessage(e), stopAt:(t,now)=>fadeOut(vg,t,now,()=>{ node.port.postMessage('stop'); node.disconnect(); vg.disconnect(); })};
  }
  const core=new (makeStringCore())(ctx.sampleRate,gauge), sp=ctx.createScriptProcessor(1024,1,1);
  sp.onaudioprocess=e=>core.render(e.outputBuffer.getChannelData(0),e.playbackTime);
  sp.connect(vg);
  return {send:e=>core.push(e), stopAt:(t,now)=>fadeOut(vg,t,now,()=>{ sp.disconnect(); vg.disconnect(); sp.onaudioprocess=null; })};
}
// mute a string at audio time t (now: cancel whatever was scheduled and mute at once), then let it go
function fadeOut(vg,t,now,release){
  const lvl=0.19*(0.35+0.65*PLUCK_V);
  if(now){ vg.gain.cancelScheduledValues(t); vg.gain.setValueAtTime(vg.gain.value,t); } else vg.gain.setValueAtTime(lvl,t);
  vg.gain.linearRampToValueAtTime(0,t+0.03);
  setTimeout(()=>{ try{ release(); }catch(err){} },Math.max(0,(t-ctx.currentTime)*1000)+120);
}
const PLUCK_V=Math.pow(100/128,1.4);                                  // the tool's velocity curve, at velocity 100

/* ---------- a run: one or more segments on the audio clock ----------
   Drill: one segment, a one-bar count-in, looping until stopped. Test: a sequence of variants, each after a two-bar count-in
   (time to read the next instructions) and played for a few loops. Each segment has its own string (its own gauge), muted at
   the segment's end as a player would. */
const TEST_VARIANTS=[
  {string:0,start:1,dir:'up'},   {string:0,start:2,dir:'down'},
  {string:1,start:2,dir:'up'},   {string:1,start:3,dir:'down'},
  {string:2,start:3,dir:'up'},   {string:2,start:4,dir:'down'},
  {string:3,start:1,dir:'up'},   {string:4,start:2,dir:'up'},   {string:5,start:4,dir:'down'},
  {string:0,start:1,dir:'up',slide:true},  {string:2,start:3,dir:'down',slide:true},
  {string:1,start:3,dir:'up',bend:true},   {string:2,start:4,dir:'down',bend:true}
];
const testLoops=bpm=>Math.max(1,Math.min(4,Math.round((4*bpm/TEST_VARIANTS.length-8)/LOOP)));   // about four minutes at any tempo
const testMinutes=bpm=>TEST_VARIANTS.length*(8+LOOP*testLoops(bpm))/bpm;
const cfgOf=d=>({string:d.string,start:d.start,dir:d.dir,plant:d.plant,slide:!!d.slide,bend:!!d.bend});
function pairFor(c){ const a=c.start,b=c.dir==='up'?a+1:a-1; return [a,b].map(f=>({finger:f,fret:POSITION+f-1})); }
function mkSeg(c){
  const notes=pairFor(c), base=Math.min(notes[0].fret,notes[1].fret);
  return Object.assign({},c,{plant:c.plant!==false,notes,base,bendFinger:base-POSITION+1,mode:c.slide?'slide':(c.bend?'bend':'fingers')});
}
const T={on:false,test:false,beat:60/70,segs:[],si:0,nextI:0,nextCycle:0,nextBeat:0,timer:null,live:[],shown:null,saved:null};
const playBtn=document.getElementById('play'), testBtn=document.getElementById('test');
function run(test){
  ensureCtx().then(()=>{
    if(T.on) stopAll();
    T.test=test; T.beat=60/drill.bpm; T.saved=test?cfgOf(drill):null;
    const list=test?TEST_VARIANTS.map(v=>Object.assign({plant:true},v)):[cfgOf(drill)];
    const loops=test?testLoops(drill.bpm):Infinity, count=test?8:COUNT;
    let t=ctx.currentTime+0.1;
    T.segs=list.map((c,k)=>{ const s=mkSeg(c); s.k=k; s.count=count; s.loops=loops; s.countStart=t; s.loopStart=t+count*T.beat; s.end=s.loopStart+loops*LOOP*T.beat;
      s.xt=s.mode==='slide'?SLIDE_T:(s.mode==='bend'?Math.min(0.16,0.4*T.beat/2):0); t=s.end; return s; });
    T.si=0; T.nextI=0; T.nextCycle=0; T.nextBeat=-count; T.live=[]; T.shown=null; T.on=true;
    tick(); T.timer=setInterval(tick,25);
    (test?testBtn:playBtn).textContent='Stop'; (test?testBtn:playBtn).classList.add('on');
    syncLock();
  });
}
function tick(){
  const horizon=ctx.currentTime+0.18;
  while(T.si<T.segs.length){
    const s=T.segs[T.si], total=s.loops*LOOP;
    for(;;){
      if(T.nextBeat>=total) break;
      const t=s.loopStart+T.nextBeat*T.beat; if(t>=horizon) break;
      const counting=T.nextBeat<0;                                   // the count-in always clicks; the figure clicks only if asked
      if(counting||drill.click) click(t,((T.nextBeat%4)+4)%4===0);
      T.nextBeat++;
    }
    for(;;){
      if(T.nextCycle>=s.loops) break;
      const e=FIG[T.nextI], t=s.loopStart+(T.nextCycle*LOOP+e.s)*T.beat; if(t>=horizon) break;
      if(!s.str) s.str=makeString(s.string/5);                       // gauge: 0 for the high e, 1 for the low E, as in the tool
      note(s,t,T.nextI,T.nextCycle===0&&T.nextI===0);
      if(++T.nextI===FIG.length){ T.nextI=0; T.nextCycle++; }
    }
    if(T.nextBeat>=total&&T.nextCycle>=s.loops){                      // segment fully scheduled: mute its string at its end, move on
      if(s.str) s.str.stopAt(s.end);
      T.si++; T.nextI=0; T.nextCycle=0; if(T.si<T.segs.length) T.nextBeat=-T.segs[T.si].count;
    }else break;
  }
  if(T.si>=T.segs.length&&ctx.currentTime>T.segs[T.segs.length-1].end+0.3) finish();
}
function track(src,g){ const rec={src,g}; T.live.push(rec); src.onended=()=>{const k=T.live.indexOf(rec); if(k>=0) T.live.splice(k,1);}; return rec; }
const pitchOf=(s,i)=>s.notes[i%2].fret;                               // the pitch of note i, in frets of this string
function note(s,t,i,first){
  const p=pitchOf(s,i), f=fretHz(s.string,p), str=s.str;
  if(s.mode==='fingers'||first){ str.send({kind:'pluck',t,f,v:PLUCK_V}); return; }
  // slide: the finger carries the string's length; bend: the finger pushes the string's tension. Either way the pitch moves
  // continuously, arriving on the beat, and only the first note of each bar is picked.
  const g0=Math.max(ctx.currentTime,t-s.xt);
  if(s.mode==='bend'&&BAR_START(i)&&p>s.base) str.send({kind:'damp',t:g0,t1:t});   // a prebend is made silently
  str.send({kind:'glide',t:g0,t1:t,f});
  if(BAR_START(i)) str.send({kind:'pluck',t,f,v:PLUCK_V});
}
// the pulse: three sounds on the click bus, beat 1 accented in each
function click(t,accent){
  const s=mix.click.sound;
  if(s==='hat'){                                                     // white noise through a highpass, short decay; the accent rings a little longer
    if(!noiseBuf){ noiseBuf=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate); const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; }
    const src=ctx.createBufferSource(); src.buffer=noiseBuf; src.loop=true;
    const hp=ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=7000; hp.Q.value=0.7;
    const g=ctx.createGain(); g.gain.setValueAtTime(accent?0.5:0.3,t); g.gain.exponentialRampToValueAtTime(0.0005,t+(accent?0.14:0.06));
    src.connect(hp); hp.connect(g); g.connect(clickBus); src.start(t); src.stop(t+0.16); track(src,g);
  }else if(s==='kick'){                                              // a sine that drops in pitch as it decays
    const o=ctx.createOscillator(); o.type='sine';
    o.frequency.setValueAtTime(accent?180:150,t); o.frequency.exponentialRampToValueAtTime(48,t+0.07);
    const g=ctx.createGain(); g.gain.setValueAtTime(accent?1.0:0.75,t); g.gain.exponentialRampToValueAtTime(0.0005,t+(accent?0.32:0.24));
    o.connect(g); g.connect(clickBus); o.start(t); o.stop(t+0.34); track(o,g);
  }else{                                                             // the plain click
    const o=ctx.createOscillator(); o.type='triangle'; o.frequency.value=accent?1760:1175;
    const g=ctx.createGain(); g.gain.setValueAtTime(accent?0.5:0.3,t); g.gain.exponentialRampToValueAtTime(0.0005,t+0.04);
    o.connect(g); g.connect(clickBus); o.start(t); o.stop(t+0.05); track(o,g);
  }
}
function stopAll(){
  if(T.timer){ clearInterval(T.timer); T.timer=null; }
  const wasTest=T.test; T.on=false; T.test=false;
  if(ctx){
    const now=ctx.currentTime;
    for(const r of T.live){ try{ r.g.gain.cancelScheduledValues(now); r.g.gain.setValueAtTime(r.g.gain.value,now); r.g.gain.linearRampToValueAtTime(0,now+0.03); r.src.stop(now+0.05); }catch(err){} }
    for(const s of T.segs) if(s.str) s.str.stopAt(now,true);
  }
  T.live=[]; T.segs=[]; T.shown=null;
  playBtn.textContent='Drill'; playBtn.classList.remove('on'); testBtn.textContent='Test'; testBtn.classList.remove('on');
  if(wasTest&&T.saved){ Object.assign(drill,T.saved); T.saved=null; }
  syncLock(); syncUI();
}
function finish(){ const n=TEST_VARIANTS.length; stopAll(); showDone(n); }

/* ---------- what the screen shows at audio time t ---------- */
function segAt(t){ let s=T.segs[0]; for(const x of T.segs){ if(x.countStart<=t) s=x; else break; } return s; }
function stateAt(t){
  const s=segAt(t), b=(t-s.loopStart)/T.beat;
  if(b<0){ const k=Math.floor(b); return {s,count:true,idx:-1,beatIdx:((k%LOOP)+LOOP)%LOOP,beatT:s.loopStart+k*T.beat}; }
  if(b>=s.loops*LOOP) return {s,count:true,done:true,idx:-1,beatIdx:-1,beatT:0};
  const cyc=Math.floor(b/LOOP), ph=b-cyc*LOOP, base=s.loopStart+cyc*LOOP*T.beat;
  let idx=0; for(let i=1;i<FIG.length;i++){ if(FIG[i].s<=ph) idx=i; else break; }
  const e=FIG[idx], onset=base+e.s*T.beat, dur=e.d*T.beat;
  return {s,count:false,ph,idx,onset,dur,nextIdx:(idx+1)%FIG.length,nextOnset:onset+dur,beatIdx:Math.floor(ph),beatT:base+Math.floor(ph)*T.beat};
}
// the sounding pitch, in frets, as a continuous value: fixed between notes, travelling in the last xt of a slide or a bend
function pitchAt(st,t){
  const s=st.s, cur=pitchOf(s,st.idx); if(s.mode==='fingers') return cur;
  const next=pitchOf(s,st.nextIdx), g0=st.nextOnset-s.xt; if(t<g0) return cur;
  let u=Math.min(1,(t-g0)/s.xt); u=u*u*(3-2*u);
  return cur+(next-cur)*u;
}
// Fingers: a finger is down while its note is written on; fingers above the sounding fret must be up; a lower finger of the
// pair stays down once placed (plant) or lifts with its note. Slide: the starting finger, from the first note on.
// Bend: the finger on the lower fret, with the fingers behind it pushing too.
function fingerDown(f,t){
  const st=stateAt(t+LEAD); if(st.idx<0) return false;
  const s=st.s;
  if(s.mode==='slide') return f===s.notes[0].finger;
  if(s.mode==='bend') return f<=s.bendFinger;
  const cur=s.notes[st.idx%2].finger;
  if(f===cur) return true;
  if(f>cur||!s.plant) return false;
  const k=s.notes.findIndex(n=>n.finger===f); if(k<0) return false;
  return t+LEAD>=s.loopStart+FIG[k].s*T.beat;
}
const BEND_PX=16;
function frame(){
  const t=(T.on&&ctx)?ctx.currentTime:null;
  const st=t!==null?stateAt(t):null, s=st?st.s:null;
  if(s&&T.test&&T.shown!==s){ T.shown=s; Object.assign(drill,{string:s.string,start:s.start,dir:s.dir,plant:s.plant,slide:s.mode==='slide',bend:s.mode==='bend'}); syncUI(); }
  const strI=s?s.string:drill.string, sy=FB.strY[strI];
  const live=!!(st&&!st.count);
  const p=live?pitchAt(st,t):null;                                  // the sounding pitch
  const shift=(live&&s.mode==='slide')?p-s.notes[0].fret:0;          // the whole hand moves with a slide; the thumb does not
  const bendAmt=(live&&s.mode==='bend')?p-s.base:0;                  // 0 at the fret's own pitch, 1 a semitone up
  const bendDy=bendAmt*BEND_PX*(strI<=2?1:-1);                       // treble strings pushed toward the bass side, bass strings pulled toward the treble
  for(const F of fingers){
    const onBent=s&&s.mode==='bend'&&F.f<=s.bendFinger;                 // a supporting finger rides the bent string where it passes
    const down=t!==null&&fingerDown(F.f,t), target=down?sy+(onBent?bendDy*(F.home-FB.nut)/(tipX(s.base)-FB.nut):0):FB.hover;
    F.y=reduce?target:F.y+(target-F.y)*0.5; if(Math.abs(F.y-target)<0.3) F.y=target;
    F.x=F.home+shift*FB.cw;
    F.c.setAttribute('cx',F.x); F.c.setAttribute('cy',F.y); F.t.setAttribute('x',F.x); F.t.setAttribute('y',F.y);
    F.guide.setAttribute('x1',F.x); F.guide.setAttribute('x2',F.x);
    const pressed=F.y>(FB.hover+sy)/2-Math.abs(bendDy);
    F.c.classList.toggle('down',pressed); F.t.classList.toggle('down',pressed);
    F.guide.setAttribute('visibility',down?'hidden':'visible');
  }
  if(bendDy||bentStr>=0) bendString(strI,tipX(s?s.base:POSITION),bendDy);
  if(live){
    const x1=s.mode==='bend'?tipX(s.base):tipXf(p);
    ringLine.setAttribute('x1',x1); ringLine.setAttribute('y1',sy+bendDy); ringLine.setAttribute('y2',sy); ringLine.setAttribute('visibility','visible');
    tabNotes.forEach((o,i)=>{ const on=i===st.idx; o.bar.classList.toggle('on',on); o.num.classList.toggle('on',on); });
    const x=xBeat(st.ph); head.setAttribute('x1',x); head.setAttribute('x2',x); head.setAttribute('visibility','visible');
    countLbl.setAttribute('visibility','hidden');
    setHand(pcOf(strI,p),pcOf(strI,pitchOf(s,st.idx)));
  }else{
    ringLine.setAttribute('visibility','hidden');
    tabNotes.forEach(o=>{ o.bar.classList.remove('on'); o.num.classList.remove('on'); });
    if(st&&!st.done){ head.setAttribute('x1',xBeat(0)); head.setAttribute('x2',xBeat(0)); head.setAttribute('visibility','visible'); countLbl.setAttribute('visibility','visible'); }
    else{ head.setAttribute('visibility','hidden'); countLbl.setAttribute('visibility','hidden'); }
    setHand(null,-1);
  }
  dots.forEach((d,b)=>{
    let on=false, r=4;
    if(st&&b===st.beatIdx){ on=true; if(!reduce){ const age=Math.max(0,t-st.beatT); r=4*(1+0.6*Math.exp(-age/0.09)); } }
    d.classList.toggle('on',on); d.setAttribute('r',r);
  });
  if(T.test&&st) syncTestLine(st);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---------- instructions ---------- */
const insFacts=document.getElementById('insFacts'), insHow=document.getElementById('insHow'), insTest=document.getElementById('insTest');
function howTo(c){
  const [a,b]=pairFor(c), lo=Math.min(a.fret,b.fret), hi=Math.max(a.fret,b.fret), k=lo-POSITION+1;
  if(c.slide) return '<span>Pick only at the start of each bar.</span> Finger '+a.finger+' stays down and the whole hand slides between frets '+a.fret+' and '+b.fret+'. <span>Bar 1</span> eighths: slide back and forth without lifting. <span>Bar 2</span> half notes: hold, then slide into the second on beat 3 while the sound carries over.';
  if(c.bend&&c.dir==='up') return '<span>Pick only at the start of each bar.</span> Finger '+k+' frets '+lo+(k>1?', the fingers behind it helping,':'')+' and bends the string until it sounds the pitch of fret '+hi+'. <span>Bar 1</span> eighths: pick, bend, release, bend. <span>Bar 2</span> half notes: pick and hold; bend on beat 3 and hold the bent note.';
  if(c.bend) return '<span>Prebend.</span> Before each bar, finger '+k+' frets '+lo+(k>1?' with the fingers behind it':'')+' and silently bends the string up to the pitch of fret '+hi+'. Pick, then release to fret '+lo+'’s own pitch. <span>Bar 1</span> eighths: release, bend, release. <span>Bar 2</span> half notes: the bent note, then release on beat 3 and hold.';
  return '<span>Pick every note.</span> <span>Bar 1</span> eighths: back and forth from finger '+a.finger+' to finger '+b.finger+'. <span>Bar 2</span> half notes: press, pick, and listen to each one sustain through the beat that passes.';
}
function factsOf(c){
  const [a,b]=pairFor(c), lo=Math.min(a.fret,b.fret);
  const who=c.slide?'finger '+a.finger+' slides':(c.bend?'finger '+(lo-POSITION+1)+' bends':'fingers '+a.finger+' → '+b.finger);
  return 'Position '+POSITION+' · '+STRINGS[c.string].name+' string · '+who+' · frets '+a.fret+' → '+b.fret+' · '+NAMES[pcOf(c.string,a.fret)]+' → '+NAMES[pcOf(c.string,b.fret)]+' · ♩ = '+drill.bpm;
}
let testLineKey='';
function syncTestLine(st){
  const n=TEST_VARIANTS.length, key=st.s.k+':'+(st.count?'c':'p');
  if(key===testLineKey) return; testLineKey=key;
  insTest.hidden=false;
  insTest.textContent='Test · '+(st.s.k+1)+' of '+n+(st.count?' · get ready, it starts after the count':'');
}
function showDone(n){ insTest.hidden=false; insTest.textContent='Test complete · '+n+' variants. Press Test to go again, or Drill to work on one.'; testLineKey=''; }

/* ---------- controls ---------- */
const bpmIn=document.getElementById('bpm'), bpmV=document.getElementById('bpmv'), clickIn=document.getElementById('click'), slideIn=document.getElementById('slide'), bendIn=document.getElementById('bend');
const segString=document.getElementById('segString'), segStart=document.getElementById('segStart'), segDir=document.getElementById('segDir'), segPlant=document.getElementById('segPlant'), plantCtl=document.getElementById('plantCtl');
const pairOfDrill=()=>pairFor(drill);
function syncUI(){
  const lock=T.on&&T.test;
  for(const b of segString.querySelectorAll('button')){ b.setAttribute('aria-pressed',+b.dataset.v===drill.string); b.disabled=lock; }
  for(const b of segStart.querySelectorAll('button')){ const v=+b.dataset.v; b.setAttribute('aria-pressed',v===drill.start); b.disabled=lock||!validStart(v); }
  for(const b of segDir.querySelectorAll('button')){ b.setAttribute('aria-pressed',b.dataset.v===drill.dir); b.disabled=lock; }
  for(const b of segPlant.querySelectorAll('button')){ b.setAttribute('aria-pressed',(b.dataset.v==='1')===drill.plant); b.disabled=lock||drill.slide||drill.bend; }
  plantCtl.classList.toggle('off',drill.slide||drill.bend);
  slideIn.checked=drill.slide; bendIn.checked=drill.bend; slideIn.disabled=lock; bendIn.disabled=lock; bpmIn.disabled=lock;
  bpmV.textContent=drill.bpm;
  rows.forEach((r,i)=>r.classList.toggle('sel',i===drill.string));
  rowLbls.forEach((l,i)=>l.classList.toggle('sel',i===drill.string));
  fingers.forEach(F=>F.guide.setAttribute('y2',FB.strY[drill.string]-6));
  insFacts.textContent=factsOf(drill); insHow.innerHTML=howTo(drill);
  if(!(T.on&&T.test)&&!insTest.textContent.startsWith('Test complete')) insTest.hidden=true;
  testBtn.title='Test: '+TEST_VARIANTS.length+' variants, about '+Math.round(testMinutes(drill.bpm))+' minutes at ♩ = '+drill.bpm;
  buildTabNotes(); buildWedge();
}
function syncLock(){ document.body.classList.toggle('testing',T.on&&T.test); }
function changed(){ insTest.hidden=true; insTest.textContent=''; syncUI(); if(T.on&&!T.test) run(false); }
function setString(i){ if(T.test&&T.on) return; if(i===drill.string) return; drill.string=i; changed(); }
segString.addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b||b.disabled) return; setString(+b.dataset.v); });
segStart.addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b||b.disabled) return; drill.start=+b.dataset.v; changed(); });
segDir.addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b||b.disabled) return; drill.dir=b.dataset.v; if(!validStart(drill.start)) drill.start+=drill.dir==='up'?-1:1; changed(); });
segPlant.addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b||b.disabled) return; drill.plant=b.dataset.v==='1'; changed(); });
slideIn.addEventListener('change',()=>{ drill.slide=slideIn.checked; if(drill.slide) drill.bend=false; changed(); });
bendIn.addEventListener('change',()=>{ drill.bend=bendIn.checked; if(drill.bend) drill.slide=false; changed(); });
bpmIn.addEventListener('input',()=>{ drill.bpm=+bpmIn.value; bpmV.textContent=drill.bpm; insFacts.textContent=factsOf(drill); });
bpmIn.addEventListener('change',()=>{ syncUI(); if(T.on&&!T.test) run(false); });
clickIn.addEventListener('change',()=>{ drill.click=clickIn.checked; });
playBtn.addEventListener('click',()=>{ if(T.on&&!T.test) stopAll(); else run(false); });
testBtn.addEventListener('click',()=>{ if(T.on&&T.test) stopAll(); else run(true); });
window.addEventListener('keydown',e=>{
  if(e.code!=='Space') return;
  const tag=(e.target&&e.target.tagName||'').toLowerCase(); if(tag==='button'||tag==='input') return;
  e.preventDefault(); if(T.on) stopAll(); else run(false);
});

// the gear: a mixer for the three sounds. Levels and the click sound are remembered on this device; mutes are not.
const gear=document.getElementById('gear'), mixer=document.getElementById('mixer');
gear.addEventListener('click',()=>{ const open=mixer.hidden; mixer.hidden=!open; gear.setAttribute('aria-expanded',open); });
const MIX_KEY='semitone-drills-mix-5';                               // the key carries the defaults' version: 80 / −8 dB / 80, Acoustic
try{ const saved=JSON.parse(localStorage.getItem(MIX_KEY)||'null'); if(saved){ for(const k of ['master','string','click']) if(typeof saved[k]==='number') mix[k].vol=Math.max(0,Math.min(100,saved[k])); if(['click','hat','kick'].includes(saved.sound)) mix.click.sound=saved.sound; if(['archtop','acoustic'].includes(saved.inst)) mix.inst=saved.inst; } }catch(err){}
function saveMix(){ try{ localStorage.setItem(MIX_KEY,JSON.stringify({master:mix.master.vol,string:mix.string.vol,click:mix.click.vol,sound:mix.click.sound,inst:mix.inst})); }catch(err){} }
[['master','volMaster','muteMaster',v=>v],['string','volString','muteString',stringDb],['click','volClick','muteClick',v=>v]].forEach(([k,volId,muteId,show])=>{
  const vol=document.getElementById(volId), val=document.getElementById(volId+'V'), mute=muteId&&document.getElementById(muteId);
  vol.value=mix[k].vol; val.textContent=show(mix[k].vol);
  vol.addEventListener('input',()=>{ mix[k].vol=+vol.value; val.textContent=show(mix[k].vol); applyMix(); });
  vol.addEventListener('change',saveMix);
  if(mute){ mute.checked=false; mute.addEventListener('change',()=>{ mix[k].mute=mute.checked; applyMix(); }); }
});
const segClick=document.getElementById('segClick');
function syncClickSound(){ for(const b of segClick.querySelectorAll('button')) b.setAttribute('aria-pressed',b.dataset.v===mix.click.sound); }
segClick.addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; mix.click.sound=b.dataset.v; syncClickSound(); saveMix(); });
syncClickSound();
const segInst=document.getElementById('segInst');
function syncInst(){ for(const b of segInst.querySelectorAll('button')) b.setAttribute('aria-pressed',b.dataset.v===mix.inst); }
segInst.addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; mix.inst=b.dataset.v; syncInst(); applyMix(); saveMix(); });
syncInst();
syncUI();
})();
</script>
