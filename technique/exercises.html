<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Drill Exercises</title>
<link rel="icon" href="../favicon.ico">
<script>(function(){ var t="dark"; try{ if(localStorage.getItem("semitone-theme")==="light") t="light"; }catch(e){} document.documentElement.setAttribute("data-theme",t); })();</script>
<style>
:root{ --bg:#ffffff; --ink:#121212; --mid:#6e6e6e; --faint:#d4d4d4; color-scheme:light; --sans:"Helvetica Neue",Helvetica,Arial,system-ui,sans-serif }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#0f0f0f; --ink:#ededed; --mid:#9b9b9b; --faint:#3a3a3a; color-scheme:dark } }
:root[data-theme="dark"]{ --bg:#0f0f0f; --ink:#ededed; --mid:#9b9b9b; --faint:#3a3a3a; color-scheme:dark }
*{ box-sizing:border-box }
body{ margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans); font-size:15px; line-height:1.4 }
.wrap{ max-width:720px; margin:0 auto; padding:28px 16px 48px }
.eyebrow{ margin:0; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--mid) }
h1{ margin:2px 0 22px; font-size:30px; font-weight:700; letter-spacing:-.01em }
ul{ list-style:none; margin:0; padding:0; border-top:1px solid var(--faint) }
li{ display:flex; align-items:center; gap:12px 16px; flex-wrap:wrap; padding:14px 0; border-bottom:1px solid var(--faint) }
.name{ font-size:18px; font-weight:700; color:var(--ink); text-decoration:none; margin-right:auto }
.name:hover{ text-decoration:underline }
.date{ color:var(--mid); font-size:13px; font-variant-numeric:tabular-nums }
button{ font:inherit; font-weight:600; font-size:13px; padding:6px 14px; border:1.5px solid var(--ink); border-radius:999px; background:var(--bg); color:var(--ink); cursor:pointer; min-width:92px }
button.done{ background:var(--ink); color:var(--bg) }
button:focus-visible, a:focus-visible{ outline:2px solid var(--ink); outline-offset:2px }
</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow">Gables Guitar Studio</p>
  <h1>Drill Exercises</h1>
  <ul id="list"></ul>
</div>
<script>
// the drill exercises, newest first: [page, name, date]
const EXERCISES=[
  ['semimodes.html','Semimodes','10/11/26'],
  ['frame-walk.html','Frame Walk','10/11/26']
];
const list=document.getElementById('list');
EXERCISES.forEach(([href,name,date])=>{
  const url=new URL(href,location.href).href, li=document.createElement('li');
  li.innerHTML='<a class="name" href="'+href+'"></a><span class="date"></span><button type="button">Copy link</button>';
  li.querySelector('.name').textContent=name; li.querySelector('.date').textContent=date;
  const b=li.querySelector('button');
  b.addEventListener('click',async()=>{
    try{ await navigator.clipboard.writeText(url); }
    catch(e){ const t=document.createElement('textarea'); t.value=url; document.body.appendChild(t); t.select(); try{ document.execCommand('copy'); }catch(e2){} t.remove(); }
    b.textContent='Copied'; b.classList.add('done'); setTimeout(()=>{ b.textContent='Copy link'; b.classList.remove('done'); },1400);
  });
  list.appendChild(li);
});
</script>
</body>
</html>
