<style>
/* Harmonic Structures: one tool for every structure. Top to bottom: the structure's name (a menu of all of them) and g(x);
   the controls (Play, Hold, Prev | Next, Let Go, tempo; the gear for sound and display); Listen (g(x) on); the TAB
   beside the ring; the means of the step between tones; the fretboard and the hand. No instruction text: the pulsing
   fingers and frets lead. Grayscale unless g(x) is on. */
:root{
  --bg:#ffffff;

  --faCol:#b89400; --tiCol:#c000c0; --doCol:#178f17; --reCol:#c86400; --miCol:#2255FF; --solCol:#c80000; --laCol:#732699; --gxg:#a8780c; --eqx:#77746c; --eqenv:#5d594f; --eqcar:#1d8a6b; --eqs5:#c4572a; --eqs7:#1f7fae;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#0f0f0f; --ink:#ededed; --mid:#9b9b9b; --faint:#3a3a3a; --board:#1a1a1a; --faCol:#FFD700; --tiCol:#FF00FF; --doCol:#22BB22; --reCol:#FF8800; --miCol:#4a74ff; --solCol:#ff2a2a; --laCol:#a462d8; --gxg:#d8a838; --eqx:#aaaaaa; --eqenv:#c8c4b8; --eqcar:#5acca8; --eqs5:#ffa07a; --eqs7:#7ad9ff; color-scheme:dark }
}
:root[data-theme="dark"]{ --bg:#0f0f0f; --ink:#ededed; --mid:#9b9b9b; --faint:#3a3a3a; --board:#1a1a1a; --faCol:#FFD700; --tiCol:#FF00FF; --doCol:#22BB22; --reCol:#FF8800; --miCol:#4a74ff; --solCol:#ff2a2a; --laCol:#a462d8; --gxg:#d8a838; --eqx:#aaaaaa; --eqenv:#c8c4b8; --eqcar:#5acca8; --eqs5:#ffa07a; --eqs7:#7ad9ff; color-scheme:dark }

*{ box-sizing:border-box }
[hidden]{ display:none !important }
body{ margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans); font-size:15px; line-height:1.4; font-variant-numeric:tabular-nums }
.wrap{ max-width:980px; margin:0 auto; padding-inline:16px; padding-block:22px 44px; display:grid; gap:18px }
header{ display:flex; flex-wrap:wrap; align-items:flex-end; gap:8px 16px; margin-bottom:-6px }   /* the g(x) button sits just above the bar's line, mirroring the gear just below it */
.hd{ display:grid; gap:2px; margin-right:auto }
.gxRow{ display:flex; align-items:center; gap:12px; margin-left:auto; min-width:0 }
.eqn{ display:flex; flex-wrap:wrap; justify-content:flex-end; column-gap:.32em; font-family:var(--serif); font-style:italic; font-weight:500; font-size:clamp(12px,1.75vw,18px); line-height:1.3; letter-spacing:.01em; color:var(--eqx); text-align:right;
  opacity:0; transform:translateX(12px); visibility:hidden; transition:opacity .9s ease, transform .9s ease, visibility 0s linear .9s }

.eqn > span{ white-space:nowrap }
.eqn .e-env{ color:var(--eqenv) } .eqn .e-car{ color:var(--eqcar) } .eqn .e-s5{ color:var(--eqs5) } .eqn .e-s7{ color:var(--eqs7) }
.gx{ font-family:var(--serif); font-style:italic; font-weight:500; font-size:14px; letter-spacing:.01em; line-height:1; flex:none; display:grid; place-items:center; width:36px; height:36px; padding:0 1px 1px 0; border:1px solid var(--mid); border-radius:50%; background:var(--bg); color:var(--mid); cursor:pointer; transition:color .6s, border-color .6s, box-shadow .6s }

.lsPairs{ color:var(--mid); font-size:14px } .lsPairs b{ font-family:var(--serif); font-style:italic; font-weight:600; font-size:1.08em }
.lsDot{ padding:0 .55em } .lsPair{ white-space:nowrap; color:var(--mid) }
.listen, .lsChain{ min-width:0 }

@media (prefers-reduced-motion: reduce){ .listen{ animation:none } .hearKnob{ transition:none } }
.insTest{ margin:0; justify-self:start; font-size:13px; font-weight:700; padding:4px 10px; border:1.5px solid var(--ink); border-radius:999px }
@media (max-width:640px){ .stage{ grid-template-columns:1fr } .ringBox svg{ max-width:220px } }

.params{ flex:1 1 100%; display:flex; flex-wrap:wrap; align-items:center; gap:10px 20px }
.chapters{ flex:1 1 100%; display:grid; gap:6px }
.mode{ position:relative; display:inline-grid; grid-template-columns:1fr 1fr; padding:0; border:2px solid var(--ink); border-radius:999px; background:var(--bg); font:inherit; font-weight:700; cursor:pointer }
.mOpt{ position:relative; z-index:1; padding:7px 16px; color:var(--ink); transition:color .2s }

.chHead{ display:flex; align-items:center; gap:12px; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--mid); font-weight:600 }
.chAll{ font:inherit; font-size:11px; letter-spacing:.02em; text-transform:none; padding:2px 9px; border:1px solid var(--mid); border-radius:999px; background:var(--bg); color:var(--ink); cursor:pointer }

.ch{ --p:0; font:inherit; font-size:12px; font-weight:600; padding:6px 2px; border:1.5px solid var(--ink); border-radius:6px; color:var(--ink); cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  background:linear-gradient(to right, var(--faint) calc(var(--p) * 100%), var(--bg) 0) }

.panel{ width:100%; min-width:0; overflow:hidden }
.panel.wide{ overflow-x:auto; overscroll-behavior-x:contain; scrollbar-width:thin }
svg{ display:block; width:100%; height:auto; max-width:100%; font-family:var(--sans) }

/* SVG parts, all through the tokens */
.ink{ fill:var(--ink) } .mid{ fill:var(--mid) } .board{ fill:var(--board) }
.inkS{ stroke:var(--ink) } .midS{ stroke:var(--mid) } .faintS{ stroke:var(--faint) }

.hand{ stroke:var(--ink); stroke-width:1.5; stroke-dasharray:4 3; stroke-linecap:round }

.hd{ display:grid; gap:2px; margin-right:auto; position:relative }

<script>
(function(){
'use strict';
const NS='http://www.w3.org/2000/svg';
const el=(tag,attrs,parent)=>{const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;};
const reduce=!!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches);

/* ---------- Harmonic Structures: one tool, Semitone first ----------
   Three things set a drill, each in one place: the HAND chooses the frequencies (fingers paired to frets, or open strings),
   the RING sets the orientation φ, and the LISTEN chooser sets which hearing of those frequencies is drilled (it morphs φ
   one tick, the hand staying put). The orientation is set, then drilled: nothing changes φ while playback runs.
   A drill is a set of pairings. Play is enabled exactly when the pairings complete the structure. Advancing is how the
   tool runs: after 4 loops the next sample's pairings replace the current ones, unless Hold is on. Every drill reverses. */
const BASS=(()=>{ let inst='acoustic', n=4; try{ const m=JSON.parse(localStorage.getItem('semitone-drills-mix-5')||'null'); if(m){ if(m.inst) inst=m.inst; if(m.bass===5) n=5; } }catch(err){}
  try{ const q=new URLSearchParams(location.search).get('inst'); if(q==='bass'||q==='bass4'||q==='bass5'){ inst='bass'; if(q!=='bass') n=q==='bass5'?5:4; } else if(q==='guitar'&&inst==='bass') inst='acoustic'; }catch(err){}
  return inst==='bass'?n:0; })();
const STRINGS=BASS?[{lbl:'G',name:'G',hz:97.9989,pc:10},{lbl:'D',name:'D',hz:73.4162,pc:5},{lbl:'A',name:'A',hz:55,pc:0},{lbl:'E',name:'E',hz:41.2034,pc:7},{lbl:'B',name:'low B',hz:30.8677,pc:2}].slice(0,BASS)
  :[{lbl:'e',name:'high e',hz:329.6276,pc:7},{lbl:'B',name:'B',hz:246.9417,pc:2},{lbl:'G',name:'G',hz:195.9977,pc:10},{lbl:'D',name:'D',hz:146.8324,pc:5},{lbl:'A',name:'A',hz:110.0,pc:0},{lbl:'E',name:'low E',hz:82.4069,pc:7}]; // pc = semitones above A
const NSTR=STRINGS.length, GAUGE=i=>BASS?[0.7,0.8,0.9,1,1][i]:i/5;     // the string model's gauge: 0 the high e … 1 the low E; bass strings heavy
const NAMES=['A','A♯/B♭','B','C','C♯/D♭','D','D♯/E♭','E','F','F♯/G♭','G','G♯/A♭'];
const fretHz=(s,n)=>STRINGS[s].hz*Math.pow(2,n/12);
const pcOf=(s,fret)=>((STRINGS[s].pc+fret)%12+12)%12;   // fret may be fractional, mid-slide
const openMidi=i=>69+12*Math.log2(STRINGS[i].hz/440);
const midiOf=(s,f)=>Math.round(openMidi(s))+f;
const FMAX=12;                                                          // the board shows frets 0–12
let FIG=[{s:0,d:.5},{s:.5,d:.5},{s:1,d:.5},{s:1.5,d:.5},{s:2,d:.5},{s:2.5,d:.5},{s:3,d:.5},{s:3.5,d:.5},{s:4,d:2},{s:6,d:2}];   // bar 1 eight eighths, bar 2 two halves: the two tones alternate, so the loop reverses
let BAR_START=i=>i===0||i===8;
let LOOP=8; const COUNT=4, LEAD=0.06, SLIDE_T=0.09, ADV_LOOPS=4;
const catchT=()=>Math.min(0.06,0.15*T.beat/2);
const POSITION=5;
const drill={dir:'up',plant:true,bpm:70,click:true,hold:false};
const SYL=['Do','Re','Mi','Fa','Sol','La','Ti'], SYLPC=[0,2,4,5,7,9,11];
const PHI={doPc:3,root:0};                                             // Do's pitch (semitones above A; 3 = C) and the modal root, by syllable
const HEAR={tido:{lo:11,names:['Ti','Do']},mifa:{lo:4,names:['Mi','Fa']}};
let hearing='tido', diatonic=true;
let FLAT_OFF=false, SEG_EACH=false;                                     // SEG_EACH: every pass of a drill is its own segment, with its own count-in                                                    // a page whose field, g(x) going off, flattens to a grey circle rather than fading
const relOf=pc=>(((pc-PHI.doPc)%12)+12)%12;
const sylOf=pc=>{ const k=SYLPC.indexOf(relOf(pc)); return k<0?null:SYL[k]; };
const hearingOf=D=>{ if(!D) return null; const r=relOf(pcOf(D.lo.s,D.lo.f)); return r===11?'tido':(r===4?'mifa':null); };
const LETTER=['A','A♯','B','C','C♯','D','D♯','E','F','F♯','G','G♯'], LETTER_B=['A','B♭','B','C','D♭','D','E♭','E','F','G♭','G','A♭'];
const nameOf=m=>{ const pc=((m-69)%12+12)%12, flat=[1,6,8,11,4].includes(PHI.doPc)||PHI.doPc===8; return (flat?LETTER_B:LETTER)[pc]+(Math.floor(m/12)-1); };

/* ---------- where the structure lives ----------
   A semitone is two tones a semitone apart: along one string (frets f, f+1), or across to the neighbouring string within
   a hand's reach (the upper tone on the higher string, up to 4 frets back). Under the field, only those heard in the chosen
   hearing count: Ti–Do (the lower tone Ti) or Mi–Fa. With g(x) off there is no field and every semitone counts. */
const ALL_SEMI=(()=>{ const out=[];
  for(let s=0;s<NSTR;s++) for(let f=0;f<FMAX;f++) out.push({lo:{s,f},hi:{s,f:f+1}});
  for(let s=0;s<NSTR-1;s++){ const sl=s+1, sh=s;
    for(let f=0;f<=FMAX;f++){ const g=midiOf(sl,f)+1-midiOf(sh,0); if(g>=0&&g<=FMAX&&Math.abs(f-g)<=4) out.push({lo:{s:sl,f},hi:{s:sh,f:g}}); } }
  return out; })();
function instances(){ if(!FIELD.on) return ALL_SEMI; const lo=HEAR[hearing].lo; return ALL_SEMI.filter(r=>relOf(pcOf(r.lo.s,r.lo.f))===lo); }

/* ---------- the hand ----------
   One rule: neighbouring fingers stay within [same fret, LIM] semitones of each other (1–2: 3, 2–3: 2, 3–4: 3; together the
   8-semitone span), never crossing; two fingers on one string need a fret between them; the thumb stays within ±3 of
   finger 2. Dragging a finger past a limit pushes or pulls its neighbour, which can push or pull the next: drag far enough
   and the whole hand travels. Fingers snap to strings and to the spot behind a fret; the thumb slides freely. */
const LIM=[0,3,2,3];
const reach=(a,b)=>{ let r=0; for(let k=a;k<b;k++) r+=LIM[k]; return r; };
function fingersFit(a,fa,sa,b,fb,sb){
  if(a===b) return false; if(a>b) return fingersFit(b,fb,sb,a,fa,sa);
  const gap=fb-fa; if(gap<0) return false; if(sa===sb&&gap<1) return false;
  return gap<=reach(a,b);
}
const HAND={f:[null,{fret:5,string:0},{fret:6,string:0},{fret:7,string:0},{fret:8,string:0}],thumb:5.5};
const cloneHand=H=>({f:H.f.map(x=>x&&{fret:x.fret,string:x.string}),thumb:H.thumb});
let P=[];                                                              // the pairings: {g: finger (0 = open string), s, f}
let MEANS='pick', DRILL=null, SEL=null;                                // DRILL: the complete structure, its plan built
let SAMPLES=[], SI=0, CUSTOM=false;                                    // the sampling Advance walks; CUSTOM: the drill was edited
const paired=g=>P.some(p=>p.g===g);
function unpair(g){ if(!g) return; const n=P.length; P=P.filter(p=>p.g!==g); if(P.length!==n) DRILL=null; }
// a finger dragged: it is held where it is; placed fingers that can no longer share the hand with it are let go (the
// farthest first); the hand then forms around what is left — rigid if nothing else is placed, stretched only as needed
function dragTo(k,s,f){
  unpair(k);
  const fits=()=>{ const fx=P.filter(p=>p.g).concat([{g:k,s,f}]); for(let i=0;i<fx.length;i++) for(let j=i+1;j<fx.length;j++) if(!fingersFit(fx[i].g,fx[i].f,fx[i].s,fx[j].g,fx[j].f,fx[j].s)) return false; return true; };
  while(!fits()){ const far=P.filter(p=>p.g).sort((a,b)=>Math.abs(b.g-k)-Math.abs(a.g-k))[0]; unpair(far.g); }
  const H=handFor(P.filter(p=>p.g).concat([{g:k,s,f}])); HAND.f=H.f; HAND.thumb=H.thumb;
}
function relayout(){ const H=handFor(P); HAND.f=H.f; HAND.thumb=H.thumb; }
// a resting hand for a set of placements: the placed fingers where they are, the others one to a fret around them, on the
// string of the nearest placed finger
// the hand as the placements make it: nothing placed, the resting shape — four fingers on four neighbouring frets, at base
// (or where finger 1 is now); placed fingers where they are, the others one to a fret around the nearest placed one. A
// stretch appears only where two placed fingers need it, and goes as soon as one of them is let go.
function handFor(pl,base,str){
  const H={f:[null,null,null,null,null],thumb:0}, fixed={};
  if(!pl.some(p=>p.g)){ let b=Math.round(base!==undefined?base:HAND.f[1].fret); b=Math.max(1,Math.min(FMAX-3,b)); const s=str!==undefined?str:HAND.f[1].string;
    for(let k=1;k<=4;k++) H.f[k]={fret:b+k-1,string:s}; H.thumb=b+0.5; return H; }
  pl.forEach(p=>{ if(p.g&&!fixed[p.g]) fixed[p.g]={fret:p.f,string:p.s}; });   // a sliding finger: where it starts
  const ks=Object.keys(fixed).map(Number);
  for(let k=1;k<=4;k++){
    if(fixed[k]){ H.f[k]={fret:fixed[k].fret,string:fixed[k].string}; continue; }
    const a=ks.reduce((b,x)=>Math.abs(x-k)<Math.abs(b-k)?x:b,ks[0]);
    H.f[k]={fret:fixed[a].fret+(k-a),string:fixed[a].string};
  }
  for(let k=2;k<=4;k++) if(!fixed[k]){ const same=H.f[k].string===H.f[k-1].string; H.f[k].fret=Math.max(H.f[k].fret,H.f[k-1].fret+(same?1:0)); }
  for(let k=3;k>=1;k--) if(!fixed[k]){ const same=H.f[k].string===H.f[k+1].string; H.f[k].fret=Math.min(H.f[k].fret,H.f[k+1].fret-(same?1:0)); }
  for(let k=1;k<=4;k++) if(!fixed[k]) H.f[k].fret=Math.max(1,Math.min(FMAX,H.f[k].fret));
  H.thumb=(H.f[1].fret+H.f[2].fret)/2;
  return H;
}

/* ---------- pairing ----------
   A completion is one way of playing the structure: its two tones, each with its finger (0: open), and the means of the
   step between them — pick (fret), slide (one finger carries the length) or bend (one finger, the upper tone a push of
   the lower fret; a prebend is the bend with the upper tone on the downbeat). A finger or fret pulses if and only if it
   belongs to at least one completion still possible given the pairings made and the hand's limits. */
function completions(){
  const out=[];
  for(const r of instances()){ const L=r.lo, H=r.hi, same=L.s===H.s;
    const gl=L.f?[1,2,3,4]:[0], gh=H.f?[1,2,3,4]:[0];
    for(const a of gl) for(const b of gh){ if(a&&b&&!fingersFit(a,L.f,L.s,b,H.f,H.s)) continue; if(!a&&!b) continue;
      out.push({r,lo:{s:L.s,f:L.f,g:a},hi:{s:H.s,f:H.f,g:b},means:'pick'}); }
    if(same&&L.f>=1) for(let a=1;a<=4;a++){
      out.push({r,lo:{s:L.s,f:L.f,g:a},hi:{s:H.s,f:H.f,g:a},means:'slide'});
      out.push({r,lo:{s:L.s,f:L.f,g:a},hi:{s:H.s,f:L.f,g:a,push:1},means:'bend'}); }
  }

    tips.forEach((p,i)=>{ const g=finger(i,pads[i],humps[i],p.kk,barre&&i===0), q=parts[i]; q.line.classList.toggle('hlSel',SELK===i+1);
      q.fill.setAttribute('d',g.d); q.tint.setAttribute('d',g.d); q.line.setAttribute('d',g.d); q.nail.setAttribute('d',g.nail); q.joint.setAttribute('d',g.joint);
      const a=alpha[i].toFixed(3); q.fill.style.opacity=a; q.tint.style.opacity=a; q.line.style.opacity=a; q.nail.style.opacity=a; q.joint.style.opacity=a; });

    // playing, it is the note being struck — its finger, its string and fret; posed, every pinned finger that is the

    const ink=inkColour(), now=live&&st&&st.idx>=0&&plan&&plan[st.idx]?plan[st.idx]:null, lit=[false,false,false,false], at=[];
    if(now){ if(FIELD.on&&now.finger>=1&&now.fret>=1){ lit[now.finger-1]=true; at[now.finger-1]={s:now.string,f:now.fret}; } }
    else if(!T.on) P.forEach(q=>{ if(!FIELD.on||!q.g||!(q.f>=1)) return; if(P.some(o=>o!==q&&o.g&&o.s===q.s&&o.f>q.f)) return; lit[q.g-1]=true; at[q.g-1]={s:q.s,f:q.f}; });
    for(let i=0;i<4;i++){ const q=parts[i], G=tg[i];
      if(lit[i]) toneCol[i]=valRGB(pcOf(at[i].s,at[i].f));
      tone[i]+=((lit[i]?1:0)-tone[i])*Math.min(1,(dt||0.016)/(lit[i]?0.05:0.25));
      if(tone[i]<0.01||!toneCol[i]){ q.line.style.stroke=''; q.nail.style.stroke=''; q.tint.style.display='none'; continue; }
      const col=rgbS(mixRGB(ink,toneCol[i],tone[i])), w=rgbS(ink);
      G.g.setAttribute('x1',f(pads[i].x)); G.g.setAttribute('y1',f(pads[i].y+WT[i]*0.5)); G.g.setAttribute('x2',f(humps[i].x)); G.g.setAttribute('y2',f(humps[i].y));
      G.a.setAttribute('stop-color',col); G.b.setAttribute('stop-color',col); G.c.setAttribute('stop-color',w); G.d.setAttribute('stop-color',w);
      q.line.style.stroke='url(#'+gid+'t'+i+')';
      // the nail, at the tip, takes the colour whole; the fill a translucent wash, strongest at the tip
      q.nail.style.stroke=col;
      for(const k of ['x1','y1','x2','y2']) G.fg.setAttribute(k,G.g.getAttribute(k));
      const tc=rgbS(toneCol[i]); G.fa.setAttribute('stop-color',tc); G.fb.setAttribute('stop-color',tc); G.fc.setAttribute('stop-color',tc);
      G.fa.setAttribute('stop-opacity',(0.32*tone[i]).toFixed(3)); G.fb.setAttribute('stop-opacity',(0.26*tone[i]).toFixed(3)); q.tint.style.display=''; }
    // the thumb's tip just out from under the near edge, the thumb going back under the neck toward the heel of the hand;
    // the forearm on down toward the player

    thT=(pads[0].x+pads[1].x)/2;
    const k=reduce?1:Math.min(1,(dt||0.016)/0.12); thx=thx===null||reduce?thT:thx+(thT-thx)*k;
    const mean=(tips[0].x+tips[1].x+tips[2].x+tips[3].x)/4; sm=sm===null||reduce?mean:sm+(mean-sm)*k;
    // under the neck, as the player sees it: the thumb's pad, a broad oval just out from under the near edge, its outer
    // side running up into the neck; and the heel of the hand, a long low line from the pad's foot across under the
    // fingers, curving up into the neck under the little finger

    // top, where it bears on the back of the neck (the flat rising a little toward the fingers)
    const c={x:thx, y:FB.bot+52}, rx=32, ry=29, Rx=tips[3].x+WT[3]*0.5, tl=c.y-ry*0.78, tr=c.y-ry*0.86;
    const pad='M'+f(c.x-rx)+' '+f(c.y)+' C'+f(c.x-rx)+' '+f(c.y-ry*0.55)+' '+f(c.x-rx*0.82)+' '+f(tl)+' '+f(c.x-rx*0.42)+' '+f(tl)
      +' C'+f(c.x-rx*0.1)+' '+f(tl-1)+' '+f(c.x+rx*0.15)+' '+f(tr)+' '+f(c.x+rx*0.45)+' '+f(tr)
      +' C'+f(c.x+rx*0.84)+' '+f(tr)+' '+f(c.x+rx)+' '+f(c.y-ry*0.5)+' '+f(c.x+rx)+' '+f(c.y)
      +' A'+rx+' '+ry+' 0 0 1 '+f(c.x-rx)+' '+f(c.y);
    thumbLine.setAttribute('d',pad); thumbFill.setAttribute('d',pad+' Z');
    // its outer side running up into the neck; the heel of the hand from the pad's foot across under the fingers and up
    const S={x:c.x-rx-12, y:FB.bot}, Pf={x:c.x+rx*0.25, y:c.y+ry*0.97}, hy0=c.y+ry*0.55, Q={x:Rx-34, y:hy0};
    const heel='M'+P2(S)+' C'+f(S.x+3)+' '+f(FB.bot+14)+' '+f(c.x-rx-3)+' '+f(c.y-24)+' '+f(c.x-rx+1)+' '+f(c.y-4)
      +' M'+P2(Pf)+' C'+f(c.x+rx+40)+' '+f(hy0+4)+' '+f(Q.x-90)+' '+f(hy0-2)+' '+P2(Q)+' C'+f(Rx-8)+' '+f(hy0+1)+' '+f(Rx+2)+' '+f(FB.bot+26)+' '+f(Rx)+' '+f(FB.bot);
    armLine.setAttribute('d',heel);
    armFill.setAttribute('d','M'+P2(S)+' L'+f(c.x)+' '+f(c.y)+' L'+P2(Pf)+' C'+f(c.x+rx+40)+' '+f(hy0+4)+' '+f(Q.x-90)+' '+f(hy0-2)+' '+P2(Q)+' C'+f(Rx-8)+' '+f(hy0+1)+' '+f(Rx+2)+' '+f(FB.bot+26)+' '+f(Rx)+' '+f(FB.bot)+' Z');
    // the pad's fold at its foot, two faint arcs
    thumbNail.setAttribute('d','M'+f(c.x-14)+' '+f(c.y+15)+' Q'+f(c.x-2)+' '+f(c.y+24)+' '+f(c.x+14)+' '+f(c.y+18)+' M'+f(c.x-18)+' '+f(c.y+18)+' Q'+f(c.x-4)+' '+f(c.y+28)+' '+f(c.x+14)+' '+f(c.y+21));
  }
  if(!BOOK.handLab){ document.body.classList.add('handOn'); return {draw}; }   // the drill pages: the hand in place of the dots, nothing more
  // posing, free of any harmony: the hand's own rules only (fingers within their reach of each other, never crossing,
  // two on one string a fret apart). Pick a finger — click it, or press 1–4 — then click where it goes; it stays pinned
  // there, the hand stretching to keep what is pinned and forming the rest around it. Let Go lifts every pin.
  parts.forEach((q,i)=>{ q.fill.style.pointerEvents='all'; q.fill.style.cursor='pointer';
    q.fill.addEventListener('click',e=>{ if(svgPoint(e).y>=FB.top) return; e.stopPropagation(); SELK=SELK===i+1?0:i+1; }); });   // a finger is picked by its knuckle, above the board
  const fits=(pl)=>{ for(let i=0;i<pl.length;i++) for(let j=i+1;j<pl.length;j++) if(!fingersFit(pl[i].g,pl[i].f,pl[i].s,pl[j].g,pl[j].f,pl[j].s)) return false; return true; };
  function pose(k,s0,f0){
    stopForEdit(); P=P.filter(p=>p.g&&p.g!==k);
    while(!fits(P.concat([{g:k,s:s0,f:f0}]))){ const far=P.slice().sort((a,b)=>Math.abs(b.g-k)-Math.abs(a.g-k))[0]; P=P.filter(p=>p!==far); }
    P.push({g:k,s:s0,f:f0}); const H=handFor(P); HAND.f=H.f; HAND.thumb=H.thumb; DRILL=null; refresh(); }
  fb.addEventListener('click',e=>{ if(!document.body.classList.contains('handOn')) return;
    const p=svgPoint(e); if(p.y<FB.top) return; let fr=0; for(let n=1;n<=FMAX;n++) if(p.x>=cellL(n)&&p.x<cellR(n)) fr=n; if(!fr) return;
    let st=0, bd=1e9; FB.strY.forEach((y,i)=>{ if(Math.abs(y-p.y)<bd){ bd=Math.abs(y-p.y); st=i; } }); if(bd>16) return;
    let k=SELK; if(!k){ let best=1e9; for(let g=1;g<=4;g++){ const c=Math.abs(HAND.f[g].fret-fr)+(HAND.f[g].string===st?0:0.1); if(c<best){ best=c; k=g; } } }
    pose(k,st,fr); SELK=0; },true);
  addEventListener('keydown',e=>{ if(/^[1-4]$/.test(e.key)&&!e.metaKey&&!e.ctrlKey){ SELK=+e.key; } if(e.key==='Escape') SELK=0; });
  const letGo=document.getElementById('clear'); letGo.hidden=false; letGo.textContent='Let Go';
  document.addEventListener('click',e=>{ if(!e.target.closest||!e.target.closest('#clear')) return; P=[]; const H=handFor([]); HAND.f=H.f; HAND.thumb=H.thumb; SELK=0; },true);   // before the page's own Let Go, which stops the click
  // CHORD GRIP: the common open and barre chords; a name poses the hand to grip it. Each is written as a chord chart
  // is, low E to high e — the frets (x unplayed, 0 open) and the fingers; a finger on more than one string is a barre,
  // lying along its fret down to the lowest string it holds
  const GRIPS=[['Open',[['C','x32010','x32010'],['A','x02220','x01230'],['G','320003','210003'],['E','022100','023100'],['D','xx0232','xx0132'],
      ['Am','x02210','x02310'],['Em','022000','023000'],['Dm','xx0231','xx0231'],['E7','020100','020100'],['A7','x02020','x01020'],['D7','xx0212','xx0213'],
      ['G7','320001','320001'],['C7','x32310','x32410'],['B7','x21202','x21304'],['Cmaj7','x32000','x32000'],['Fmaj7','xx3210','xx3210']]],
    ['Barre',[['F','133211','134211'],['Fm','133111','134111'],['F♯m','244222','134111'],['G','355433','134211'],['A','577655','134211'],
      ['B♭','x13331','x12341'],['B','x24442','x12341'],['Bm','x24432','x13421'],['C','x35553','x12341'],['Cm','x35543','x13421']]]];

  const panel=document.createElement('div'); panel.className='gripPanel';
  panel.innerHTML='<p class="gripHd">Chord Grip</p>';
  GRIPS.forEach(([grp,list])=>{ const row=document.createElement('div'); row.className='gripRow';
    row.innerHTML='<span class="gripGrp">'+grp+'</span>';
    list.forEach(([nm,fr,fi])=>{ const b=document.createElement('button'); b.type='button'; b.className='gripBtn';
      const at=grp==='Barre'?Math.min(...[...fr].filter(c=>c!=='x').map(Number).filter(n=>n>0)):0;

  document.addEventListener('click',e=>{ if(e.target.closest&&(e.target.closest('#clear')||e.target.closest('#fb'))) panel.querySelectorAll('.gripBtn.on').forEach(x=>x.classList.remove('on')); },true);

  const btn=document.createElement('button'); btn.type='button'; btn.className='pill'; btn.id='handTog';
  const sync=()=>{ const on=document.body.classList.contains('handOn'); btn.textContent=on?'Dots':'Hand'; btn.setAttribute('aria-pressed',on); };
  btn.addEventListener('click',()=>{ document.body.classList.toggle('handOn'); sync(); });
  document.body.classList.add('handOn'); sync();

  return {draw};
})():null;
{ const prev=frameHook; frameHook=(st,live,plan,dt)=>{ if(prev) prev(st,live,plan,dt); if(HANDLAB) HANDLAB.draw(dt,st,live,plan); }; }

applySample(0);

})();
